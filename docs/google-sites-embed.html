 heat, and take 4 additional points of damage from heatand fire-based attacks."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"No Vital Organs",effect:"Called Shots deal no extra damage."},{name:"Sleep Reduction",effect:"Florans require half the usual amount of sleep."}],gear:["Items appropriate to their trade","Some have a simple firearm or knife (Str+d4)"],description:"Florans are mobile, sentient beings that evolved from plants. Their appearance varies widely, but most are capable of emitting puffs of pollen which affect others’ perception. The profile below is for a typical floran citizen, though they are just as likely to be soldiers, scientists, or spacefarers as any other galactic species with suitable skills and Edges."},{id:"scifi_fractal_ray",name:"Fractal Ray",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:6,toughness:6,armor:0,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d6",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d6, AP 1."},{name:"Flight",effect:"Pace 8."},{name:"Hypnotism",effect:'Creatures within 12" (24 yards) who behold a fractal ray must make a Smarts roll or become Stunned. Blind creatures, or those who rely on sound or other forms of vision are immune to this effect. Viewing a fractal ray through a screen or mirror may grant a bonus to resist this effect (GM’s call).'},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."}],description:"These bizarre creatures have triangular wings and long tails, much like Terran rays, but glide along the wind currents above ground. Their elegant undulations and complex patterning mesmerize prey long enough for fractal rays to get close enough to wrap around their prey and begin eating. On ocean worlds, or those with thin atmospheres or high gravity, they might be water creatures instead (Aquatic: Pace 8)."},{id:"scifi_gelatinoid",name:"Gelatinoid",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Cannot Speak",effect:"Unless aided by devices, gelatinoids can understand other languages but may only communicate with members of their own species."},{name:"Gelatinous",effect:"Half-damage from falling or collisions; no extra damage from Called Shots. May make an Athletics roll to move through small openings, which takes 1d6 rounds and makes the gelatinoid Vulnerable (treat as Difficult Ground)."},{name:"Slow Regeneration",effect:"May make natural healing rolls once per day."},{name:"Weak",effect:"−1 to Strength rolls."}],gear:["Items appropriate to their trade","Some have a simple firearm or knife (Str+d4)"],description:"These life forms are sentient cell colonies, protein clusters, or other translucent, mobile liquids. Despite the seeming limitations of their bodies, some may also serve as scientists or warriors, with suitable skills and Edges."},{id:"scifi_gene_thief",name:"Gene Thief",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:9,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d12",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d8"},{name:"Stealth",die:"d8"}],abilities:[{name:"Bite/Claws/Horns",effect:'Str+d8. May freely "create" claws, barbs, teeth, horns, and other natural weapons anywhere on its body as a free action.'},{name:"Colony",effect:"Gene thieves mimic the bodies of those they replicate, but do not have organs of their own. +2 Toughness; +2 to recover from Shaken; no additional damage from Called Shots, ignores invisibility and all Illumination penalties; immune to poison, paralysis, slumber, Stun, blind, Intimidation, Taunt, puppet; doesn’t sleep."},{name:"Fast Regeneration",effect:"Gene thieves may attempt a natural healing roll every round, even if Incapacitated, unless their Wounds were caused by fire or flame or they’re put to the torch afterward."},{name:"Fear (−2)",effect:"Seeing a gene thief change its form provokes a Fear check."},{name:"Very Resilient",effect:"A gene thief can take two Wounds before being Incapacitated."}],description:'Little is known about these terrifying organisms—where they come from, how many exist, or even what they look like in their natural state. A gene thief attacks a target’s cells, first analyzing and then copying their DNA, rapidly replicating the host from within until it has full control down to a cellular level. All it needs is a moment of contact to begin this process, but it can only do so with living cells or those which have been dead for no more than an hour. The process takes 1d4 hours to complete. Afterward, the creature completely adopts the host’s appearance and knowledge. Gene thieves use this to move among others without revealing their true identity. They have access to the target’s attributes and skills, using the higher of the two as they desire, but do not gain Edges and Hindrances. Once a gene thief acquires a target’s DNA it can appear as that individual at any time, even if it moves to a new host. There’s some evidence that those "absorbed" by a gene thief still remain conscious but buried somewhere in there—forever…'},{id:"scifi_ghevok",name:"Ghevok",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:2,scale:"Large",pace:8,parry:4,toughness:9,armor:1,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d6",strength:"d12",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +1",effect:"Furry hide."},{name:"Bite",effect:"Str."},{name:"Kick",effect:"Str+d4, to the front or rear as desired. The ghevok balances on its tail when kicking. Anyone mounted on the ghevok must roll Riding to remain in the saddle."},{name:"Size 2",effect:"Ghevoks typically stand nine feet tall and weigh half a ton."}],description:"Ghevoks are marsupial herd animals from a planet of vast, fertile grasslands. They are notable for their bipedal posture, thick fur, and speed, making them ideal mounts in places where vehicles aren’t as viable. Ghevoks are bred throughout the galaxy as draft animals, though they tend to become demoralized when unable to run for extended periods of time."},{id:"scifi_glitch",name:"Glitch",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:2,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d4",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d4"},{name:"Electronics",die:"d6"},{name:"Hacking",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Accidental Mishap",effect:"Each day the glitch is in the ship, roll a die. Odd, the glitch has burned out a vital system. Roll on the Vehicle Critical Hit table. The ship suffers no actual Wounds, however, just the effects of the Critical Hit. A Crew result means it has caused an accident for one of the crew (electrocution, an airlock incident, or even a private message blasted to the entire ship). Treat a Hull result as minor effects with no lasting damage."},{name:"Glitch In The Machine",effect:"Any use of the ship’s systems suffers a −2 penalty due to the interference of the glitch, including gunnery, maneuvering, or jumping to hyperspace."},{name:"Removal",effect:"Removing a glitch requires the crew to shut down every system on the ship except the FTL drive. Each 30 minutes a ship is powered down, the glitch makes a Smarts roll. If it succeeds, it locates the FTL drive and escapes back into hyperspace. A glitch will not exit a ship in normal space, even if the FTL drive is powered up, as normal space is instantly fatal to them. While the ship is powered down, the crew had best don spacesuits. Oxygen runs out and the temperature drops to below freezing in 10 minutes times the vessel’s Size (see the Starship Frames table on page 147)."}],description:"Glitches are extra-dimensional entities inhabiting hyperspace and attracted to the powerful emission of a starship’s FTL drive. They lurk in the hyperspace field surrounding the ship and inevitably get pulled into the ship’s systems. Once there, the glitches wreak havoc with various systems. Few glitches act maliciously— most seek only to escape back to hyperspace. Unfortunately, they are not overly intelligent and make their presence felt by flicking lights on and off, opening and closing automatic doors, and other such phenomena. Reports of ships possessed by ghosts are most likely glitch infested. Glitches have no language of their own but sometimes attempt to communicate by forwarding existing messages—which they sense as communication— to random addresses in the ship. This often leads to disaster as private or confidential information is shared. They resemble sparks of energy in their natural state, but can form into general shapes to communicate with other species."},{id:"scifi_gray_goo",name:"Gray Goo",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:5,scale:"Large",pace:8,parry:2,toughness:12,armor:0,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d12+2",strength:"d8",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Notice",die:"d8"}],abilities:[{name:"Construct",effect:"+2 to recover from being Shaken; ignores 1 point of Wound penalties; doesn’t breathe or suffer from disease or poison."},{name:"Envelop",effect:'Gray goo attacks by enveloping its target, then inflicting millions of microscopic "bites" as the nanites begin breaking down the target’s molecular structure. It hits automatically (unless Shaken) and causes 2d6 damage to all targets it touches at the end of their turn. Weapons suffer a −1 damage penalty (max −3) and armor loses 1 point of Armor bonus until it reaches 0 and falls apart. Those in completely sealed suits are immune—at least until the gray goo deals enough damage to the suit!'},{name:"Fear",effect:"Anyone who sees the creature must make a Fear check."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Ooze",effect:"Though comprised of machines, gray goo is a micro colony. It ignores invisibility and Illumination penalties. It does not sleep, and is immune to Called Shots, poison, paralysis, slumber, Stun, blind, Intimidation, Taunt, and puppet."},{name:"Replicate",effect:"As long as gray goo has access to adequate raw materials it heals one Wound or splits and becomes two gray goos every 1d4 hours."},{name:"Size 5 (Large)",effect:"This gray goo is the size of a Small Blast Template (2-yard radius) and weighs four tons."},{name:"Unstoppable",effect:"Takes a maximum of one Wound (after Soaking) from any damaging attack unless the attacker’s Action Card is a Joker."},{name:"Very Resilient",effect:"Can take two additional Wounds."},{name:"Weakness (Electricity)",effect:"Gray goo is vulnerable to electricity and electrical attacks. Electricity deals damage normally and ignores Unstoppable (see above)."}],description:'One of the most terrifying threats in the galaxy, "gray goo" looks like a huge gray pool of mobile slime. In reality it is comprised of billions of self-replicating, microscopic nanobots. Whether designed for this purpose, hacked by a psychopathic villain, or merely glitching catastrophically, gray goo relentlessly "consumes" any organic matter—or possibly any matter—it comes in contact with, dismantling objects molecule by molecule and then using the raw materials to manufacture more nanobots. A small blob of gray goo can, in time, consume entire space stations, literally reducing them to atoms. Unless found very early gray goo is encountered as 2d6 "blobs" —each the size of a Small Blast Template— which move and act together.'},{id:"scifi_grazer",name:"Grazer",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:8,scale:"Huge",pace:6,parry:6,toughness:18,armor:2,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d6",strength:"d12+8",vigor:"d12"},skills:[{name:"Athletics",die:"d4"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Armor +2",effect:"Thick hide on the torso and legs (+2). A grazer gains an extra +4 Armor against Called Shots to its dense, bony head."},{name:"Hardy",effect:"Grazers do not suffer a Wound from being Shaken twice."},{name:"Horns",effect:"Str+d10 (I). Heavy Weapon."},{name:"Size 8 (Huge)",effect:"Grazers weigh 25,000 pounds."},{name:"Trample",effect:"Str+d8."}],description:"The head of these large herbivores is a wide, flat lump of dense bone with no obvious features. Covering the head are millions of tiny pits, each an olfactory sensor. The eyes, which are small and suited only to close- range work, are located on the underside of the head, along with an elephant-like trunk. Unlike an elephant, however, this is not a grasping appendage but the mouth and neck. While the grazer can only see what it’s eating, its keen olfactory pits remain alert for predators. Their head is actually a weapon, used in mating rituals and to butt predators. They have been known to severely damage vehicles, which they often see as a rival."},{id:"scifi_gremlin",name:"Gremlin",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:2,armor:0,attributes:{agility:"d10",smarts:"d6",spirit:"d8",strength:"d4",vigor:"d8"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Repair",die:"d6"},{name:"Stealth",die:"d10"}],abilities:[{name:"Bite/Claws",effect:"Str."},{name:"Invulnerability",effect:"Gremlins are invulnerable to all electrical-based damage."},{name:"Sabotage",effect:"Every day a ship or vehicle is infested with gremlins, roll a Critical Hit (with no accompanying Wound). A Crew result means an accident for one of the personnel—such as electrocution (2d6 damage), a faulty airlock, a spacesuit has a hole in it, etc. Treat a Hull result as damage to a minor system, giving a −2 penalty to relevant skill rolls until it is repaired."},{name:"Size −4 (Tiny)",effect:"Gremlins are four inches tall."}],description:"The gremlins presented here aren’t the mystical creatures of fairy tales, but they have much the same effect on starships. These creatures are small, scaly creatures about the size of small rats. They subsist on electricity, so should they get aboard vehicles or ships they chew through wires and other electronics which can quickly render even the largest ship unsound. The creatures are extremely resilient to chemicals and other vermin-control methods, and where there is one there are many (usually 2d20). The best way to purge a ship is to cut power to all electrical systems for a full week."},{id:"scifi_hacker",name:"Hacker",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Electronics",die:"d8"},{name:"Fighting",die:"d4"},{name:"Hacking",die:"d8"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d6"},{name:"Repair",die:"d8"},{name:"Research",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Cyberdeck","Installed cyberware: Data jack"],description:"Some tech-savvy types earn a living hacking into computer networks, virtual reality, or cyberspace to steal data or override systems."},{id:"scifi_harpooner",name:"Harpooner",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:2,scale:"Large",pace:"—",parry:4,toughness:9,armor:0,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d8",strength:"d12",vigor:"d10"},skills:[{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Shooting",die:"d10"},{name:"Stealth",die:"d10"}],abilities:[{name:"Amorphous Body",effect:"Called Shots have no effect on harpooners. Bullets cause normal damage (mostly from hydrostatic shock), but other non-powered piercing weapons such as knives or arrows don’t."},{name:"Bite",effect:"Str+d6."},{name:"Harpoon",effect:'Range 3/6/12, Damage Str+d6. Reloading a missed shot takes one round. If a victim suffers a Shaken or Wound result, he must make an opposed Strength roll. The harpooner drags the victim 2" per success and raise. The connecting sinew has Toughness 8. Severing it requires the attacker to inflict a Wound, but this does not affect the harpooner, who grows a new harpoon in 1d6 days.'},{name:"Size 2",effect:"Harpooners can grow to as much as 30’. This specimen is a mere 9’ long."}],description:"Harpooners are large slugs with what looks like a horn growing from the front of their heads. The horn is, in fact, a specialized weapon. Connected to the body by a thin but tough length of sinew, the harpooner can build up internal pressure within its head, which it then releases, firing out the horn and trailing sinew. When it strikes flesh, the barbed horn sticks fast. The harpooner then retracts the harpoon and whatever it has struck to its waiting mouth. Harpooners crawl into small nooks and crannies when they are young and remain there for the rest of their lives, growing only as much as the hole allows. If attacked, the thing withdraws its head back into the hole."},{id:"scifi_haze_barnacle",name:"Haze Barnacle",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:2,parry:5,toughness:8,armor:2,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d8",strength:"d4",vigor:"d10"},skills:[{name:"Athletics",die:"d4"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +2",effect:"Shell."},{name:"Poison (−2)",effect:"Small Blast Template. Victims who fail their Vigor roll die in 2d6 minutes. Characters in completely sealed suits are immune."},{name:"Size −1",effect:'Haze barnacles measure 2’ across and are 6" thick.'},{name:"Slow",effect:"Barnacles cannot run."}],description:"Haze barnacles are molluscs, spending much of their time hunkered down in their thick shells. A series of fine nozzles on the top of the shell produces puffs of purple gas (the creature’s exhalations). When prey nears, the creature puffs out a cloud of deadly poisonous gas. Only when the victims have stopped moving does the barnacle slowly crawl onto them and begin feasting."},{id:"scifi_hugger",name:"Hugger",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:8,armor:2,attributes:{agility:"d10",smarts:"d8 (A)",spirit:"d10",strength:"d12+3",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d12"}],abilities:[{name:"Armor +2",effect:"Thick plates."},{name:"Bite/Claws",effect:"Str+d6."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Hardy",effect:"Multiple Shaken results do not cause a Wound."},{name:"Paralysis",effect:"Anyone Shaken or Wounded by a tail attack must make a Vigor roll or be paralyzed for 2d6 rounds."},{name:"Tail",effect:"Str+d8, Reach 1, AP 2, −2 to Fighting when used. "}],description:"Huggers feed off carbon dioxide emissions, such as those found in breathing exhalations. They attack by leaping at the face of their prey and smothering them into unconsciousness. They then secrete chemicals which keep the prey unconscious until the victim eventually dies from dehydration. The spider-like creatures have no fangs, eyes, or mouths. They have specialized vents, pores, and tiny hairs that work together to help it locate prey and absorb food. These aliens are insectoids armored in thick dark bone or shell carapace. They have no discernible eyes but seem to see with senses not yet understood. Their primary weapons are powerful, extendable jaws and sharp claws, and long tails tipped with barbed stingers. The things have only the most basic sentience—or perhaps share a sentience with their insect-like hive. They are skilled hunters and use simple but effective tactics to divide and conquer their prey."},{id:"scifi_queen",name:"Queen",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!0,size:0,scale:"Normal",pace:10,parry:7,toughness:16,armor:4,attributes:{agility:"d8",smarts:"d8 (A)",spirit:"d12",strength:"d12+6",vigor:"d12"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"}],abilities:[{name:"Armor +4",effect:"Thick plates."},{name:"Bite/Claws",effect:"Str+d10, AP 3."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Hardy",effect:"Multiple Shaken results do not cause a Wound."}],description:"At the center of the hive lives the queen. Although her primary function is to lay eggs, she is a voracious hunter and fearless in defending her clutch. The queen has six legs and looks something like a cross between a beetle and a massive mantis."},{id:"scifi_hive_warrior",name:"Hive Warrior",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:4,scale:"Large",pace:8,parry:6,toughness:4,armor:0,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d8",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Elite",effect:"Huggers get a free reroll on failed Fighting results."},{name:"Size −2 (Small)",effect:"Huggers are 2’ across."},{name:"Smother",effect:"Huggers add +2 to Athletics rolls to make or maintain a grapple (targets up to Size 2). If the target is Bound, the hugger has a hold around the victim’s face, who takes a level of Fatigue each round. Once Incapacitated, the prey remains that way until the hugger is removed or the victim dies."},{name:"Unusual Sense",effect:"Huggers sense carbon dioxide with pinpoint accuracy. They halve Illumination penalties against living creatures not breathing through a rebreather or enclosed air supply system."},{name:"Paralysis (−4)",effect:"Anyone Shaken or Wounded by a tail attack must make a Vigor roll or be paralyzed for 2d6 rounds."},{name:"Size 4 (Large)",effect:"The queen stands 14’ high and is typically 20’ or more long. She has a narrow, segmented body."},{name:"Tail",effect:"Str+d10"}],description:""},{id:"scifi_impaler",name:"Impaler",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:3,scale:"Large",pace:8,parry:6,toughness:12,armor:2,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d10",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Armor +2",effect:"Thick, leathery hide."},{name:"Bite",effect:"Str+d10, AP 4."},{name:"Claws",effect:"Str+d4. Can make up to six attacks on a single target each round at no penalty."},{name:"Size 3",effect:"Impalers stand over 10’ tall."},{name:"Stab and Grab",effect:"An impaler scoring a raise with at least two claw attacks has impaled its foe. The beast may then attack with its bite as a limited free action, adding +2 to that attack and damage."}],description:"Impalers are among the top carnivores on their home world. They have four muscular legs and a thick tail forming their lower body. From the front of the torso protrudes a thick vertical “neck” which ends in a huge, forward-facing maw filled with rows of razor-sharp triangular teeth. The neck actually comprises the creature’s head and upper body, and holds the stomach, lungs, and heart. Extending from the lower part of the neck are six arms, each tipped with four spear-like claws arranged in a square. Impalers attack by stabbing prey with their claws, then attacking with their fearsome teeth. Despite having six arms, they are quite short in comparison to the beast, and it may only attack one target at a time with them. However, it uses all six independently."},{id:"scifi_insect_giant",name:"Insect, Giant",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:2,scale:"Large",pace:6,parry:5,toughness:11,armor:2,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d10",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +2",effect:"Carapace."},{name:"Bite",effect:"Str+d6, AP 2."},{name:"Burrow (4)",effect:"Giant insects can move through soil at Pace 4."},{name:"Size 2",effect:"This specimen is 9’ long and slightly taller than a man at the top of its head. Smaller and larger specimens may be found."}],description:"Massive insects can be found on many worlds, living in colonies of a few dozen to millions of creatures. They aren’t particularly dangerous in small numbers, but most travel in herds of 2d20, and many are connected through pheromones or even psionics to a queen that can direct more creatures to a perceived threat. There are many different varieties of giant insect. Those profiled below are burrowers, but a different species might have Flight, Claws, Poison, or other natural abilities."},{id:"scifi_insectoid",name:"Insectoid",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:14,armor:8,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"360-Degree Vision",effect:"Ignore 1 point of Gang Up bonus."},{name:"Armor +2",effect:"Dense exoskeleton."},{name:"Cannot Speak",effect:"Unless aided by devices, insectoids can understand other languages but may only communicate with members of their own culture."},{name:"Claws",effect:"Str+d4, AP 2."},{name:"Communal",effect:'Add +2 to Spirit rolls when within 12" (24 yards) of other insectoids.'},{name:"Separation Disorder",effect:"−2 to Spirit rolls when no other insectoids are within line of sight."}],gear:["Combat armor (+6), Gatling laser (Range 50/100/200, Damage 3d6+4 (I), AP 4, RoF 4, Cauterize, Heavy Weapon, No Recoil, Overcharge, Snapfire), molecular knife (Str+d4+2, AP 2), 3× incendiary grenades"],description:"Insectoids are any number of sentient humanoid species with an anatomy that resembles an insect. They are usually communal and organized around a hive. The following profile is for an insectoid soldier."},{id:"scifi_ironclaw",name:"Ironclaw",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:3,scale:"Large",pace:8,parry:6,toughness:9,armor:0,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d10",strength:"d12+2",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"}],abilities:[{name:"Bite",effect:"Str+d4."},{name:"Chameleon",effect:"If the ironclaw has some cover or darkness and moves half its Pace or less, it gains +4 to Stealth rolls."},{name:"Claws",effect:"Str+d8, AP 2."},{name:"Leaper",effect:"Double jumping distance."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Size 3",effect:"Adult ironclaws weigh over a ton. "},{name:"Extra Limbs",effect:"Kalians have four arms and two primary hands, and gain +1 Gang Up if directing multiple weapons at a target or +1 to Athletics rolls involving the limbs."},{name:"Frail",effect:"−1 Toughness."}],description:"Crews jokingly call this ape-like horror the “lesser spotted ironclaw,” fooling less experienced crew members into believing there is a greater spotted ironclaw. The first thing anyone notices about the horror is its diamond-like claws, but it also has the ability to change its color by fluffing different combinations of multi-hued hairs covering its body."},{id:"scifi_krok",name:"Krok",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:22,armor:4,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d6",strength:"d12+8",vigor:"d12+4"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +4",effect:"Heavy Armor. Thick, scaly hide."},{name:"Bite",effect:"Str+d12"},{name:"Hardy",effect:"A second Shaken result does not cause a Wound."},{name:"Semi-Aquatic",effect:"Pace 10. A krok can hold its breath for 15 minutes. Irrasc are bipedal, with two huge grasping claws and a vertical, fang-lined mouth. Their tiny eyes and brain make them easy to fool, but as anyone who has ever fought one can attest, it’s very hard to break free once one grabs you."}],description:"These enormous specimens are found in the shallows of warm oceans, but occasionally a storm may wash one into a coastal swamp or lake. They bear a striking resemblance to Earth's crocodiles, though much larger and with spikes on their thick skins."},{id:"scifi_irrasc",name:"Irrasc",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:7,scale:"Large",pace:8,parry:6,toughness:16,armor:3,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d8",strength:"d12+7",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"Armor +3",effect:"Thick hide."},{name:"Bite",effect:"Str+d8, AP 4."},{name:"Claws",effect:"Str+d6. +2 to Athletics and Strength rolls made to grapple."},{name:"Roar",effect:"Irrasc can emit a terrifying roar. All those within 12” (24 yards) must make a Spirit roll or be Shaken."},{name:"Size 7 (Large)",effect:"These fearsome creatures stand 30’ tall and weigh over 16 tons."}],description:""},{id:"scifi_kalian",name:"Kalian",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:8,scale:"Huge",pace:6,parry:7,toughness:8,armor:4,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d8"},{name:"Taunt",die:"d8"}],abilities:[{name:"Additional Action",effect:"Reduce Multi-Action penalties by 2."},{name:"Ancestral Enemy (Saurians)",effect:"Subtract 2 from Persuasion when dealing with saurians (or a culture of the GM’s choosing)."},{name:"Size 8 (Huge)",effect:"A giant krok can reach up to 30 feet in length."},{name:"Tail Sweep",effect:'Instead of making a bite attack, a krok can sweep all opponents within Reach 3. This may be Evaded. Size 3 or less creatures who fail are knocked back 2d6" and Stunned.'}],gear:["Light battle armor (+4), 4× vibro swords (Str+d8+d6, AP 2), blaster pistol (Range 12/24/48, Damage 2d6+2, AP 2)"],description:"The kalians are a four-armed species which hail from an up-and-coming planetary system. They are known for their quick reactions, sharp wit, marksmanship, and swordplay. The profile below is for a typical swashbuckling kalian rogue, who earns a living as a smuggler, pirate, bootlegger—or all three."},{id:"scifi_law_enforcement",name:"Law Enforcement",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:9,armor:4,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Body armor (+4), commlink, handcuffs, heavy pistol (Range 12/24/48, Damage 2d10, AP 4), stun baton (Str+d4, Stun)","Heavier gear as needed"],description:"Law enforcement officials may be the local police, customs officials, a federal agency, or hired security guards."},{id:"scifi_living_planet",name:"Living Planet",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:6,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d6"},{name:"Psionics",die:"d10"},{name:"Stealth",die:"d4"}],abilities:[{name:"Psionics",effect:"As extensions of the living planet, simulacrum possess rudimentary psionic power."},{name:"Steal Identity",effect:"Simulacra replicate the memories, Traits, Hindrances, and Edges of the person they are imitating. Those who know the original person may make a Notice roll at −4 to detect anything amiss. This penalty may be reduced to −2 or eliminated entirely for characters who are particularly close, such as immediate relatives or romantic partners."}],description:'Living planets are immense creatures of mind- boggling size. They can be created when, over untold eons, plant or fungal colonies grow to encompass an entire asteroid, moon, or planet. Others are the end product of ecosystems which become so interconnected they begin functioning as a single being. Others might even be members of an as-yet unknown species of colossal, spherical creatures that resemble celestial bodies. A living planet’s "mind" is a decentralized neural network comprised of trillions of individual nodes, capable of learning new information as the entity interacts with its environment. The sheer scope of this planet-sized brain allows living planets to psychically interface with creatures that come in contact with it. Despite all this brainpower, living planets cannot communicate—at least not in any way currently recognized. Instead, they use the memories of sentient beings to create simulacra that take the form of friends, associates, family, or loved ones. These simulacra may be solid or merely phantasms. They are convincing in every detail, but since they are formed of memories, may lack key details which give away their artificial nature. Living planets do not have attributes or skills of their own, as they can only interact through their simulacra. They might retaliate against attacks—if they even notice them— but suffer no actual damage unless attacked by weapons of a similarly massive scale. Simulacrum take the form of persons familiar to the individual with which the living planet wishes to make contact. Simulacrum magnify the innate personality traits of the person being imitated, because the living planet has little understanding of such things and bases its copy from imperfect memories. The profile below is for a basic human similacrum. Adjust Traits, Hindrances, and Edges as needed.'},{id:"scifi_malific",name:"Malific",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:3,scale:"Large",pace:6,parry:6,toughness:17,armor:6,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d12+2",vigor:"d12"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Occult",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Science",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"Armor +6",effect:"Thick hide."},{name:"Bite/Claws",effect:"Str+d4."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Separation Disorder",effect:"When no other malifics are within line of sight the character suffers −2 to Spirit rolls."},{name:"Size 3",effect:"The typical malific stands over 9’ tall and has a powerful, brawny frame."},{name:"Telepathy",effect:'A malific can communicate mentally with any sapient lifeform within 12" (24 yards) regardless of language.'},{name:"Tentacles (2)",effect:"Two tentacle actions and Reach 1. Tentacles deal Str+d4 damage. Bound or Entangled prey may be bitten as usual."}],gear:["Energy blade gauntlets (Str+d8 (I), AP 4, HW, Cauterize)"],description:"Malifics are aliens who come from alternative dimensions where reality functions in different ways. Some are mistaken for demons, while others look like clusters of writhing tentacles, bizarre symmetrical shapes, or other unearthly builds. Some also have psionics or employ technology so alien it qualifies as Weird Science."},{id:"scifi_mechanoid",name:"Mechanoid",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:5,scale:"Large",pace:10,parry:5,toughness:15,armor:4,attributes:{agility:"d10",smarts:"d6",spirit:"d4",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Electronics",die:"d8"},{name:"Hacking",die:"d10+2"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Shooting",die:"d6"}],abilities:[{name:"Armor +4",effect:"Metallic body. blade, and saw blade). The attacks may be directed at the same target or different targets."},{name:"Construct",effect:"+2 to recover from being Shaken; ignore 1 point of Wound penalties; doesn’t breathe, immune to poison and disease."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Flamethrower",effect:"Damage 3d6"},{name:"Matter Cutter",effect:"Damage 2d4+8"},{name:"Molecular Blade",effect:"Str+d8+2, AP 4."},{name:"Saw Blade",effect:"Str+d8, AP 4."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the recycler adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Size 5 (Large)",effect:"Recyclers are usually the size of a rhino and weigh four tons."}],description:"Originating from another galactic arm— or perhaps another galaxy altogether— mechanoids are a civilization of aggressive, autonomous robots. For eons they have been systematically expanding, colonizing new solar systems and stripping them for raw materials, building immense structures to harness or generate energy, manufacture more machines, or for other unguessable purposes. The mechanoids have been at it for so long they no longer remember the species that created them. Now they exist only for their own undisclosed purposes, slowly consuming everything in the known galaxy. Mechanoids view organic-based life as fundamentally inferior: messy, disorderly, easily damaged, frequently defective, prone to irrational and even self-destructive behavior, bafflingly individualistic, and a waste of perfectly good raw elements. Mechanoids attack organic beings on sight, and are seemingly uninterested in diplomacy. These multi-legged machines specifically target technology employed by organic life forms, causing it to cease functioning, short- circuit, or—ideally—turn on its maker."},{id:"scifi_support_drone",name:"Support Drone",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:4,scale:"Large",pace:6,parry:2,toughness:10,armor:4,attributes:{agility:"d6",smarts:"d6",spirit:"d4",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d8"},{name:"Notice",die:"d6"},{name:"Repair",die:"d8"}],abilities:[{name:"Armor +4",effect:"Metallic body."},{name:"Construct",effect:"+2 to recover from being Shaken; ignore 1 point of Wound penalties; doesn’t breathe, immune to poison and disease."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Matter Cutter",effect:"Damage 2d4+8"},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the drone adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Size 1",effect:"Support drones are slightly larger than a human and come in many forms."},{name:"Construct",effect:"+2 to recover from being Shaken; ignore 1 point of Wound penalties; doesn’t breathe, immune to poison and disease."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Laser SMG",effect:"Range 15/30/60, Damage 2d6, AP 2, RoF 4, Cauterize, No Recoil, Overcharge."},{name:"Matter Cutter",effect:"Damage 2d4+8"},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the contaminator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Size 4 (Large)",effect:"Contaminators are 12’ tall, heavily built, and weigh 4,000 pounds."},{name:"Skill Bonus (Hacking +2)",effect:"Contaminators have numerous codebreaking, signal routing, and code insertion subroutines."}],description:"These machines are designed for construction, repairs, and other support functions. They are quadrupedal and employ a variety of internally mounted tools."},{id:"scifi_recycler",name:"Recycler",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:16,armor:4,attributes:{agility:"d6",smarts:"d6",spirit:"d4",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Shooting",die:"d6"}],abilities:[{name:"Armor +4",effect:"Metallic body."},{name:"Arms Akimbo",effect:"As a limited action a recycler may attack with each of its arms (flamethrower, matter cutter, molecular"}],description:"The purpose of these machines is to break apart and convert matter into raw materials. For this purpose recyclers employ a variety of matter cutters, sanders, rotor saws, diamond-tipped grinders, blowtorches, or monofilament blades. They usually move about on four legs but some recyclers are designed for liquid or aerial environments."},{id:"scifi_war_drone",name:"War Drone",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:2,scale:"Large",pace:8,parry:7,toughness:15,armor:6,attributes:{agility:"d8",smarts:"d6",spirit:"d4",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Electronics",die:"d8"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Shooting",die:"d8+2"}],abilities:[{name:"Armor +6",effect:"Sturdy, reinforced frame."},{name:"Construct",effect:"+2 to recover from being Shaken; ignore 1 point of Wound penalties; doesn’t breathe, immune to poison and disease."},{name:"Cutting Arm",effect:"Str+d8, AP 2."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Gatling Laser",effect:"Range 50/100/200, Damage 3d6+4"},{name:"Leaper",effect:"Double jumping distance."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the drone adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Size 2",effect:"Battle drones are 9’ tall, heavily built, and weigh 1000 pounds."},{name:"Skill Bonus (Shooting +2)",effect:"Battle drones have advanced combat algorithms."},{name:"Targeting",effect:"Negates 2 points of Range or Unstable Platform penalties."}],description:"When the machine empire comes in contact with organic life forms, it manufactures war drones to eliminate the nuisance."},{id:"scifi_merchant",name:"Merchant",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Academics",die:"d8"},{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d4"},{name:"Gambling",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d8"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, personal data device"],description:"Merchants are savvy, experienced traders. They are very knowledgeable about the commodities they peddle, and are often excellent wheeler-dealers who know how to convince others to buy their goods. Most either own their own ship or work for a larger conglomerate, and always travel with at least one bodyguard. For common merchants who rarely (if ever) leave their home world, use the Citizen profile on page 237."},{id:"scifi_mimic",name:"Mimic",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d8"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d8"},{name:"Taunt",die:"d6"},{name:"Thievery",die:"d8"}],abilities:[{name:"No Vital Organs",effect:"Called Shots deal no extra damage."},{name:"Shapeshift",effect:"As a limited free action, a mimic can assume the appearance of another being up to two Sizes larger or smaller than her (but gains no benefits or penalties due to the Size change). The details are as perfect as the individual can observe, even fingerprints and retinal patterns if the information is available."}],gear:["Varies with disguise, but usually a laser pistol (Range 15/30/60, Damage 2d6, AP 2) and molecular knife (Str+d4+2, AP 2)"],description:"Any number of species can change their physical form to appear as members of another species. The profile below is for a mimic spy, an occupation for which they are uniquely gifted."},{id:"scifi_miner",name:"Miner",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:6,armor:1,attributes:{agility:"d6",smarts:"d4",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d4"},{name:"Gambling",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d4"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Spacesuit (+1, if in space), matter disintegrator"],description:"Working in an asteroid belt or a planet rich in minerals but with a deadly atmosphere, miners are grizzled, hardy, and always seeking the big find that will enable them to retire."},{id:"scifi_monkey",name:"Monkey",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:4,armor:0,attributes:{agility:"d8",smarts:"d10 (A)",spirit:"d6",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d6"}],abilities:[{name:"Bite",effect:"Str+d4."},{name:"Brachiation",effect:"Monkeys can move at their full Pace in trees or similar environments and don’t normally need to make Athletics (climbing) rolls."},{name:"Leaper",effect:"Double jumping distance."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Size −1",effect:"Monkeys are about 4’ tall."}],description:"A wide variety of monkey-like creatures dot the cosmos. Some alien variants appear below, all of which use the same basic profile but add Special Abilities."},{id:"scifi_mucus_frog",name:"Mucus Frog",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:4,toughness:6,armor:0,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Amphibious",effect:"Pace 6."},{name:"Dependency (Water)",effect:"The frogs must immerse in water at least one hour out of every 24 or suffer Fatigue each day until they perish."},{name:"Leaper",effect:"Double jumping distance."},{name:"Mucus Spit",effect:"Range 3/6/12. On a hit, the target is Entangled (Bound with a raise). A hit against an already Entangled target increases the effect to Bound. Bound victims suffer a level of Fatigue at the start of each round until they die or the mucus is removed (see Breaking Free from a Device, page 77)."}],description:"Mucus frogs have large, bloated bodies with primitive forearms and stubby tails. Three eyestalks sit equidistant on the top of their heads. Their jaws are wide and powerful, and allow them to spit balls of sticky, suffocating mucus at their prey. The mucus hardens quickly once exposed to air or water, and is only softened by chemicals in the frog's saliva."},{id:"scifi_needlebush",name:"Needlebush",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:1,scale:"Normal",pace:"—",parry:2,toughness:9,armor:2,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Notice",die:"d6"},{name:"Shooting",die:"d8"}],abilities:[{name:"Armor +2",effect:"Needlebushes are protected by thick bark."},{name:"Plant",effect:"Immune to paralysis, poison, puppet, slumber, Stun; doesn’t sleep."},{name:"Poison",effect:"Anyone Shaken or Wounded by the spines must make a Vigor roll or die in 2d6 rounds."},{name:"Size 1",effect:"Needlebushes are taller than an average human."},{name:"Thorns",effect:"A needlebush fires a volley of thorns every round it senses prey within a Large Blast Template centered on itself. Everything within suffers 2d4 damage."}],description:"Not all carnivores are animals. Needlebushes are similar in appearance to cacti and their thick, waxy coating is covered in thousands of small pores. When a creature touches the bark, whether brushing up against it or to feast on the plant, it launches poisonous needles from the holes. The plant cannot limit its attack to the area touched, and so fires spines in a circular pattern. The needlebush uses its extensive root network to supplement hydration and feed on the decomposing flesh of its victims."},{id:"scifi_neo_animal",name:"Neo-Animal",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:6,armor:0,attributes:{agility:"d10",smarts:"d6",spirit:"d6",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d12"},{name:"Common Knowledge",die:"d4"},{name:"Electronics",die:"d4"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d4"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Repair",die:"d4"},{name:"Science",die:"d4"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d8"},{name:"Taunt",die:"d8"}],abilities:[{name:"Bite",effect:"Str."},{name:"Brachiation",effect:"Chimps can move at their full Pace in trees or similar environments and don’t normally need to make Athletics (climbing) rolls."},{name:"Pounce",effect:"+4 to damage instead of +2 when making a Wild Attack."},{name:"Size −1",effect:"Chimpanzees are four feet tall and weigh around 125 pounds."}],description:'Attitudes about genetic modification and enhancement vary throughout the galaxy, and even through the histories of most intelligent species. In campaigns where such technologies are available—and legal—careful genetic engineering can enhance the incipient capacities of suitable animal species, "uplifting" them to sentience. Neo-animals are usually granted many or most of the rights of their sentient peers, though in some settings social opinion remains deeply divided about their inherent "humanity." In this case, give them the Outsider Hindrance. All neo-animals are fluent with the language in which they were raised, but are difficult to understand without vocal synthesizers or other aids. To make neo-animals, simply remove their animal intelligence (A), and add any missing core skills (Athletics, Common Knowledge, Notice, Persuasion, and Stealth) at d4 or higher, along with any Hindrances and Edges which make sense for their species. Genetically engineered chimps are often employed for their small size and natural athleticism. They are quick, clever, and capable of great empathy, but are also known for their hair-trigger tempers.'},{id:"scifi_neo_dog",name:"Neo-Dog",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:7,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d6",vigor:"d6"},skills:[],abilities:[],description:"Dogs which have undergone genetic engineering are just as ferociously loyal and alert as their unmodified ancestors, but are far easier to train and are capable of assisting in nearly any capacity."},{id:"scifi_neural_cloud",name:"Neural Cloud",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:15,scale:"Gargantuan",pace:6,parry:4,toughness:28,armor:0,attributes:{agility:"d4",smarts:"d8(A)",spirit:"d10",strength:"d4",vigor:"d12+10"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d12"},{name:"Persuasion",die:"d6"},{name:"Science",die:"d8"},{name:"Stealth",die:"d4"},{name:"Shooting",die:"d10"},{name:"Survival",die:"d10"}],abilities:[{name:"Fast Regeneration",effect:"Neural clouds may attempt a natural healing roll every round."},{name:"Fusion Blast",effect:"When threatened, a neural cloud can create a fusion reaction and direct the energy toward enemies with Shooting. Range 100/200/400, Damage 5d10"},{name:"Size 15 (Gargantuan)",effect:"Neural clouds are miles across, but their mass is spread thin across that area."},{name:"Unstoppable",effect:"Takes a maximum of one Wound (after Soaking) from any damaging attack unless the attacker’s Action Card is a Joker."},{name:"Bite",effect:"Str+d4."},{name:"Size −1",effect:"The heads of these canines come to an average human’s waist, and they weigh about 60 pounds."},{name:"Speed",effect:"d10 running die."}],description:""},{id:"scifi_neo_dolphin",name:"Neo-Dolphin",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:5,toughness:7,armor:1,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Academics",die:"d4"},{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d4"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d12"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d6"},{name:"Science",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Aquatic",effect:"Pace 10."},{name:"Atmospheric Dependency",effect:"Dolphins must remain immersed in liquid water in order to survive. They treat any other atmosphere as being Hazardous. Those without a rebreather (or spacesuit if the pressure is too low) must check Vigor every hour or suffer a Fatigue level that can lead to death. When the dolphin is reimmersed at standard pressure it recovers one Fatigue level every 10 minutes."},{name:"Bash",effect:"Str."},{name:"Weakness (Magnetism)",effect:"Neural clouds suffer a −4 penalty to resist magnetic effects, and suffer +4 damage from magnetic attacks."}],gear:['Specialized spacesuit (+1, "walk" Pace 6, may manipulate objects), atmosphere recycler, commlink'],description:"The greatest achievement of the Terran genetic engineering program are the neo-dolphins. These cetaceans are gifted problem-solvers who excel at spacial and temporal reasoning. As aquatic creatures, they require special suits (complete with rebreathers, water purifiers, and mentally linked manipulator arms) to operate outside of water environments. In campaigns with psionics, neo-dolphins might have a natural aptitude for psychic manipulation. Give them Psionics d8, the Arcane Background (Psionics) Edge, and three suitable powers."},{id:"scifi_omega_crab",name:"Omega Crab",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:4,scale:"Large",pace:8,parry:6,toughness:15,armor:4,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d8",strength:"d12+4",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Aquatic",effect:"Pace 8."},{name:"Armor +4",effect:"Heavy Armor; thick shell."},{name:"Claws",effect:"Str+d8"},{name:"Size 4 (Large)",effect:"The shells of omega crabs are 15 feet long at their widest point and weigh over two tons."}],description:"These huge crab-like creatures are found throughout the oceans and beaches of the galaxy. They are voracious hunters who attack anything they can crack or rend with their powerful claws."},{id:"scifi_oracle",name:"Oracle",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:4,armor:0,attributes:{agility:"d6",smarts:"d10",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Psionics",die:"d10"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"},{name:"Taunt",die:"d6"}],abilities:[{name:"Frail",effect:"−1 Toughness."},{name:"Telepathy",effect:'An oracle can communicate mentally with any sapient lifeform within 12" (24 yards) regardless of language.'}],description:"These extraterrestrials have a natural affinity for mental, spiritual, or supernatural powers, perhaps due to a mysterious connection with other dimensions, ancient beings, microscopic parasites, arcane energies, or other sources beyond usual understanding. The profile below reflects an oracle with psionic powers in addition to their natural abilities."},{id:"scifi_orthocone",name:"Orthocone",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:6,scale:"Large",pace:"—",parry:6,toughness:13,armor:2,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d8",strength:"d12+4",vigor:"d6"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"}],abilities:[{name:"Aquatic",effect:"Pace 10."},{name:"Armor +2",effect:"Thick shell."},{name:"Bite",effect:"Str+d6."},{name:"Size 6 (Large)",effect:"Orthocones are 40 feet long."},{name:"Tentacles (4)",effect:"Four tentacle actions and Reach 1. Tentacles deal Str+d6 damage. Bound or Entangled prey may be bitten as usual. A victim killed by an orthocone’s tentacles is usually ripped in half."}],description:"Orthocones are long, cylindrical sea creatures with tentacles around their mouths. They move through the sea by sucking in water and pushing it out through special holes, propelling themselves at great speeds."},{id:"scifi_pendulum_bird",name:"Pendulum Bird",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:1,scale:"Normal",pace:"—",parry:6,toughness:6,armor:0,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d8",strength:"d12+2",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d8"}],abilities:[{name:"Bash",effect:"Str+d8, Repulse."},{name:"Bite",effect:"Str+d4."},{name:"Flight",effect:"Pace 12."},{name:"Low Gravity",effect:"−1 Toughness."},{name:"Size 1",effect:"Pendulum birds have a wingspan of 30’ and a 6’ long body."}],description:"Pendulum birds are large avians, capable of flight only because of the low gravity of their home world. Sometime during their evolution, their legs fused into a single limb and their feet into a solid lump of bone. This lack of limbs means they spend their entire lives in the air, eating and mating on the wing. When attacking, they swoop down on their prey and unleash their bony leg, which is strong enough to smash armor plating and bone. Once the prey is dead, they make a series of dives to snatch at flesh with their sharp beaks."},{id:"scifi_pentamouth",name:"Pentamouth",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:2,scale:"Large",pace:4,parry:6,toughness:10,armor:0,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d8",strength:"d10",vigor:"d12"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d10"}],abilities:[{name:"Bite",effect:"Str+d6, Reach 2."},{name:"Multiple Heads",effect:"A pentamouth may make up to five Fighting attacks but only two heads may attack a single foe."},{name:"Size 2",effect:"Pentamouths are very dense. Most adults measure 6’ in length and 3’ in diameter."}],description:"A pentamouth has a thick, knobby, cylindrical body which ends in five long necks, each ending in a large “head” with a tooth-filled mouth. Each head contains rudimentary visual organs but no brain—which is found in the central body. Pentamouths are slow- moving and prefer to lie in low burrows and wait for prey to pass by. They can sense vibrations within ten yards."},{id:"scifi_pirate",name:"Pirate",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:1,attributes:{agility:"d6",smarts:"d4",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d6"},{name:"Repair",die:"d4"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Spacesuit (+1), cutlass (Str+d6), blaster pistol (Range 12/24/48, Damage 2d6+2, AP 2)"," PIRATE OFFICER Pirate officers direct the actions of pirate crew during boarding attempts, battles, and routine tasks"],description:"Pirates earn a living by attacking other ships and stealing their cargo. They usually target poorly armed and heavily laden merchant craft in remote locations. Some ruthless pirate gangs never leave prisoners who could identify them. Others sell captives to slavers, hold them for ransom, or set them free so that their next victims will hopefully surrender without a fight. Typical pirates are not much more than thugs with a cutlass."},{id:"scifi_pirate_officer",name:"Pirate Officer",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:7,toughness:9,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d8"},{name:"Taunt",die:"d8"}],abilities:[],gear:["Armored spacesuit (+4), power cutlass (Str+2d6), blaster pistol (Range 12/24/48, Damage 2d6+2, AP 2)"," PIRATE CAPTAIN Pirate captains are experienced pirates who command one or more pirate ships"],description:"Pirate officers direct the actions of pirate crew during boarding attempts, battles, and routine tasks."},{id:"scifi_pirate_captain",name:"Pirate Captain",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:8,toughness:10,armor:4,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d10"},{name:"Repair",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d8"},{name:"Taunt",die:"d8"}],abilities:[],gear:["Combat spacesuit (+4), chain cutlass (2d6+4), plasma pistol (Range 12/24/48, Damage 2d10 (I), Cauterize, Heavy Weapon, Plasma)"],description:"Pirate captains are experienced pirates who command one or more pirate ships."},{id:"scifi_possessor",name:"Possessor",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:6,armor:0,attributes:{agility:"d8",smarts:"d10",spirit:"d10",strength:"d4",vigor:"d8"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d12"},{name:"Stealth",die:"d12"}],abilities:[{name:"Ethereal",effect:"Possessors are beings of pure psychic energy."},{name:"Immunities",effect:"Possessors (not their hosts) are immune to cold, heat, radiation, poison, and disease. They do not require air, food, or water to survive."},{name:"Possess",effect:"A possessor tries to possess its opponent’s body with an opposed Spirit roll at −2. With success, the possessor gains complete control of its host’s body. The victim may attempt to force the alien out every hour (another opposed Spirit roll). If the host is rendered unconscious, the possessor is forced to flee the body immediately."},{name:"Steal Identity",effect:"Possessors gain access to their host’s memories, skills, and Edges, but are not affected by their Hindrances. To keep up appearances, Possessors mimic any such foibles. Those who know the victim may make a Notice roll at −4 to detect anything amiss. This penalty may be reduced to −2 or eliminated entirely for characters who are particularly close, such as immediate relatives or romantic partners."}],description:"Possessors are noncorporeal alien beings resembling insubstantial shimmering colors in their natural form. They have the ability to take over a sentient body, which they can then use as their own. Some species seek only to learn about their host’s culture. Others are more malicious."},{id:"scifi_psi_beast",name:"Psi Beast",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:7,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Psionics",die:"d8"}],abilities:[{name:"Psionics",effect:"All psi beasts have 15 Power Points. In addition, they have one of the psionic abilities below. Carnivore (Ambusher): This beast ambushes its prey using the teleport power. Carnivore (Lure): The thing has the puppet power. This may be a siren-song lure or require the beast to make eye contact with its prey. Carnivore (Speed Hunter): The beast has increased Pace and has the speed power. Carnivore (Stealth Hunter): These hunters get close to prey using the invisibility power. Carnivore (Stunner): The beast prefers to eat its prey alive. It has the stun power. Herbivore (Armored): Has extra Armor and the deflection power. Herbivore (Scary): The beast sends out telepathic signals which panic predators. It has the fear power. Herbivore (Survivor): Survivors rely on their Pace to outrun predators, getting a boost from the speed power."}],description:"Psi beasts are regular animals that employ psionics or psionic-like powers. Apply the template below to the creature in question to get the effect you’re looking for."},{id:"scifi_psi_booster",name:"Psi Booster",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:2,parry:2,toughness:3,armor:0,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d12",strength:"d4",vigor:"d6"},skills:[{name:"Notice",die:"d6"}],abilities:[{name:"Embedded",effect:"Psi boosters become rooted to their host. Unless the host dies, psi boosters are loathe to leave a healthy body and resist being removed. Extracting one requires complex surgery and a Healing roll at −4. Failure results in the death of the host!"},{name:"Psionic Boost",effect:"The psionicist adds +2 to Psionics rolls and each raise reduces the Power Point cost by 1 (this stacks with the Channeling Edge, to a minimum cost of 1 Power Point)."},{name:"Size −2 (Small)",effect:'Psi boosters are 2’ long and 2" thick.'}],description:"Psi boosters are small, squid-like entities. Although they are not truly psionic, they possess the remarkable ability to channel and boost psionic powers. The creatures are parasites, allowing their host to use their ability in return for taking sustenance from him. The host must eat 25% more food than usual to maintain his energy levels. Psi boosters attach to the back of the host’s head, sinking a thick tentacle through the back of the skull (an automatic Wound), which intertwines around the spinal cord. The creatures know who has psionic powers and never attach to non-psionicists."},{id:"scifi_psi_eater",name:"Psi Eater",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:2,parry:2,toughness:1,armor:0,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d12",strength:"d4",vigor:"d6"},skills:[{name:"Notice",die:"d6"},{name:"Stealth",die:"d8"}],abilities:[{name:"Absorb Psionics",effect:'Any psionicist within 5" (10 yards) of a psi eater has −4 to his Psionics roll. Anyone touching a psi eater has the benefits of the Improved Arcane Resistance Edge.'},{name:"Size −4 (Tiny)",effect:"Psi eaters are six inches long and two inches thick."}],description:"Psi eaters are green slug-like creatures with an unusual diet: they consume psionic energy. They are highly sought after by those who must deal with psionicists regularly, but must be restrained to prevent the creatures from moving inexorably toward their food source."},{id:"scifi_psi_knight",name:"Psi-Knight",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:8,toughness:9,armor:4,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Psionics",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Body armor (+4, energy skin), energy katana (Str+d8+1 (I), AP 4, HW)"," PSI-KNIGHT MASTER"],description:"Psi-knights are a dedicated order of warriors who combine the ancient code of chivalry with psionics and swordplay. As with any organization, some members are good and noble people, serving to uphold peace in the galaxy. Others use their powers for personal gain, or to promote the cause of evil and chaos."},{id:"scifi_psi_knight_master",name:"Psi-Knight Master",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:10,toughness:10,armor:4,attributes:{agility:"d10",smarts:"d8",spirit:"d10",strength:"d10",vigor:"d8"},skills:[{name:"Athletics",die:"d10"},{name:"Common Knowledge",die:"d8"},{name:"Fighting",die:"d12"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Psionics",die:"d10"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Body armor (+4, energy skin), energy katana (Str+d8+1 (I), AP 4, HW)"],description:""},{id:"scifi_psionicist",name:"Psionicist",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:9,armor:4,attributes:{agility:"d6",smarts:"d10",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Psionics",die:"d10"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"},{name:"Taunt",die:"d6"}],abilities:[],gear:["Body armor (+4), energy knife (Str+d4+4 (I), AP 2, HW), and laser pistol (Range 15/30/60, Damage 2d6, AP 2)"],description:"Psionicists have unlocked the power of their mind to protect themselves and their allies, or confuse and blast their foes. Whether “psions” are accepted members of society or hunted outcasts depends on the setting."},{id:"scifi_puppet_master",name:"Puppet Master",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:2,toughness:2,armor:0,attributes:{agility:"d4",smarts:"d10",spirit:"d12",strength:"—",vigor:"d8"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d6"},{name:"Notice",die:"d6"},{name:"Psionics",die:"d10"},{name:"Stealth",die:"d8"}],abilities:[{name:"Embedded",effect:"Puppet masters would rather see their victim die than break free of their control. Surgically removing a puppet master requires a Healing roll at −4. With a failure, the puppet master makes a Psionics roll opposed by the victim’s Spirit. Each success and raise lowers the victim’s Smarts by one die type as it destroys the brain as an act of revenge. A victim reduced to below d4 Smarts is a vegetable. The same applies if the creature is ever Wounded—though it only has one attempt to destroy its victim’s brain before it dies."},{name:"Possession",effect:"If a puppet master gets to the back of a victim’s neck, usually while he’s asleep, it inserts its tendrils into the spinal column and makes an opposed Spirit roll. Once attached, the creature is in complete control of its victim, gaining access to all his skills, memories, Edges, and even psionic powers (if the host has them). The host can never break free unless someone removes the puppet master."},{name:"Size −4 (Tiny)",effect:"Puppet masters are four inches in diameter."}],description:"There are more ways to conquer a planet than blasting it to atoms with superior firepower. Puppet masters are small spider-like creatures with a human eye in the center of their back. They are biotechnology tools, used to control important people by attaching themselves to the spinal cord of sentient beings so they can monitor and control the victim’s thoughts."},{id:"scifi_quadrapus",name:"Quadrapus",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:2,scale:"Large",pace:"—",parry:5,toughness:8,armor:0,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d8",strength:"d10",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Bite",effect:"Str+d4."},{name:"Flight",effect:"Pace 4."},{name:"Size 2",effect:"These beasts measure 20’ long from head to tentacle tip."},{name:"Tentacles (4)",effect:"Four tentacle actions and Reach 1. Tentacles deal Str+d4 damage. Bound or Entangled prey may be bitten as usual."}],description:"A quadrapus is vaguely similar in appearance to a four-armed octopus. It has a bulbous head with an eye on each side, a beak on the underside, and four long tentacles. Unlike the octopus, however, the quadrapus lives on land. The quadrapus is a floater, rather than a flyer or glider. It drifts in the air currents of its low-gravity world, expelling jets of air sucked in through its beak to retain its height. Quadrapuses are not the smartest of hunters, and simply drift along dangling their tentacles along the ground and lunging at anything trying to avoid their grasp. A quadrapus attacks by either slapping its prey or grappling with it. A quadrapus may take up to four different actions each round with its tentacles, either slapping or grappling at no Multi-Action penalty."},{id:"scifi_quadroid",name:"Quadroid",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:7,armor:2,attributes:{agility:"d6",smarts:"d4",spirit:"d6",strength:"d12",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d4"},{name:"Gambling",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d4"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"}],abilities:[{name:"Additional Action",effect:"Reduce Multi-Action penalties by 2."},{name:"Extra Limbs",effect:"Quadroids have four arms and two primary hands, and gain +1 Gang Up if directing multiple weapons at a target or +1 to Athletics rolls involving the limbs."},{name:"Frail",effect:"−1 Toughness."}],gear:["Synth-mesh suit (+2)"],description:"This localized variety of four-limbed humanoids are often employed as laborers or guards due to their additional appendages, but are especially prone to disorientation during FTL travel in place of ancestral enemies.."},{id:"scifi_quatha",name:"Quatha",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:6,scale:"Large",pace:8,parry:4,toughness:16,armor:1,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d8",strength:"d12+6",vigor:"d12+2"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d4"},{name:"Stealth",die:"d4"},{name:"Survival",die:"d6"}],abilities:[{name:"Armor +1",effect:"Tough hide."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Low Light Vision",effect:"Quatha ignore penalties for Dim and Dark Illumination."},{name:"Size 6 (Large)",effect:"Quatha are similar to an African elephant in size and weigh eight tons."},{name:"Tireless",effect:"Immune to Fatigue."},{name:"Trample",effect:"Str+d6."}],description:'These huge, lumbering quadrupeds originated on a world with few natural predators. Their sturdy frames, extraordinary endurance, and docile, trusting nature made them excellent mounts or beasts of burden. Though the original quatha were lizard-like, with thick, pebbly skin and inset eyes (to shield them from bright sunlight), the term is widely used for an
