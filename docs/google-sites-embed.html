y similar beast of the same general size, temperament, and nature. A "quatha" on one planet might be elephant- like, with thick, woolly hide and defensive horns on its tail. On another, a "quatha" might be a six-legged beast with infrared-sensing eyes and no discernible head. The profile below is for a typical hairless quatha from a temperate, dry world. Adjust the profile as needed to suit the locale.'},{id:"scifi_radbeast",name:"Radbeast",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:2,scale:"Large",pace:4,parry:4,toughness:14,armor:6,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d8",strength:"d10",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d10"}],abilities:[{name:"Acid",effect:"If forced to fight, radbeasts rear up and plop forward in an attempt to grapple. If successful, the victim suffers 3d6 damage"},{name:"Armor +6",effect:"Heavy Armor. Thick, stony body."},{name:"Bash",effect:"Str+d10"},{name:"Immunity",effect:"Radbeasts suffer no harm from radiation."},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."},{name:"Radiation Projection",effect:"Radbeasts eat all manner of rock, but favor radioactive minerals. As an action, they can project an intense radiation field around their bodies as a form of defense. Any creature within a Medium Blast Template centered on the beast must make a Vigor roll or suffer a level of Fatigue. A character Incapacitated by this attack or who rolls a Critical Failure to resist contracts radiation sickness (see Savage Worlds)."},{name:"Size 2",effect:"A radbeast’s stony body weighs almost a ton."}],description:"Radbeasts are silicon-based life forms that resemble a slithering collection of small rocks with no discernible limbs. Indeed, they have no discernible features of any sort. They do have sensory organs, but these are attuned to heat rather than light. They actually eat rock, digesting it with powerful acids and using osmosis to transfer the resulting paste to their bodies. Through some quirk of chemistry, they cannot dissolve diamonds. In certain systems they are used as diamond miners. The radbeasts dissolve the stone around the gem, leaving behind raw diamonds for collection later."},{id:"scifi_rakashan",name:"Rakashan",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:11,armor:6,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Stealth",die:"d8"},{name:"Shooting",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"Ancestral Enemy (Floran)",effect:"Subtract 2 from Persuasion when dealing with florans (or a culture of the GM’s choosing)."},{name:"Bite/Claws",effect:"Str+d4."},{name:"Low Light Vision",effect:"Rakashans ignore penalties for Dim and Dark Illumination."}],gear:["Infantry battle suit (+6), laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge)"],description:"These feline humanoids come in many varieties, but all have sharp teeth and claws."},{id:"scifi_rascal",name:"Rascal",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:5,parry:5,toughness:6,armor:4,attributes:{agility:"d6",smarts:"d6",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Ancestral Enemy (Insectoid)",effect:"Subtract 2 from Persuasion when dealing with insectoids."},{name:"Reduced Pace",effect:"Rascals have small legs. Pace −1, and d4 running die."},{name:"Size −3 (Very Small)",effect:"Rascals stand around 16 inches in height and weigh 20 pounds."}],gear:["Body armor (+4), laser pistol (Range 12/24/48, Damage 2d6+2, AP 2), molecular knife (Str+d4+2, AP 2), 2× incendiary grenades"],description:"The diminutive, weasel-like rascals are experienced warriors, having spent decades defending themselves against a species of aggressive insectoids."},{id:"scifi_ravager",name:"Ravager",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:6,toughness:9,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"Fear",effect:"Anyone who sees a ravager must make a Fear check."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Pack Tactics",effect:"Ravagers add any Gang Up bonus to their Fighting damage as well as the attack roll."},{name:"Resilient",effect:"Can take one additional Wound."}],gear:["Light club (Str+d4), knife (Str+d4), handmade mace (Str+d6), or improvised weapon"],description:'Sometimes the profound emptiness of space, its mind-shattering scale, its staggering eons of time, and its cold indifference to humanity can have a deleterious effect on the human mind. This is more than just "space madness"—a mental disorder common among solo astronauts—but something deeper, a fundamental break of the human psyche. The afflicted are called "ravagers"— crazed berserkers bent on destroying all other life. Ravagers are remarkably quick, agile, and strong. Most issue a constant stream of babble or cannot speak at all. However, they’re incapable of strategy or complex thought—at least as far as anyone can tell. Most bizarrely, though, ravagers don’t see other ravagers as a threat—and in fact have been known to work together using crude pack tactics. Some even cling to a sliver of their former expertise, allowing them to pilot spacecraft, fire weapons, or disable complex electronics. The profile below is for a typical human ravager, though members of any sapient species may join their number.'},{id:"scifi_sandmaw",name:"Sandmaw",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:10,scale:"Huge",pace:"—",parry:5,toughness:22,armor:4,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d6",strength:"d12+10",vigor:"d12"},skills:[{name:"Athletics",die:"d4"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d10"}],abilities:[{name:"Armor +4",effect:"Thick hide."},{name:"Bite",effect:"Str+d8."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Size 10 (Huge)",effect:'Sandmaws stretch 60 feet from mouth to tail, but most of their mass is underground. Their ring-like mouths are 3" (6 yards) across.'},{name:"Swallow Whole",effect:"Anyone hit by a bite attack must make an Evasion roll or be Swallowed Whole. At the end of the creature’s subsequent turns, anyone swallowed must make a Vigor roll at −2 or take a Wound from the crushing gullet and acidic bile. Shaking, Wounding, or otherwise provoking the creature may result in opportunities to escape with an Athletics roll."},{name:"Tentacles (1)",effect:"One tentacle action and Reach 5. Tentacles deal Str+d4 damage. Bound or Entangled prey may be bitten as usual."}],description:"Usually found on desert worlds, sandmaws are huge, predatory worms that catch prey by burrowing into the sand. The loose earth of the sandmaw’s crater makes it hard for prey to climb back out. When they finally grow tired they slide down into the waiting sandmaw’s lamprey-like mouth. Once established, sandmaws never move. They live long enough that local intelligent beings often include sandmaw pits on maps."},{id:"scifi_saurian",name:"Saurian",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:12,armor:6,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Stealth",die:"d6"},{name:"Shooting",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"Armor +2",effect:"Scaly skin."},{name:"Bite",effect:"Str+d6, AP 2."},{name:"Cold-Blooded",effect:"Subtract 1 from Agility, Strength, and Vigor rolls after spending more than ten minutes in temperatures below 60° Fahrenheit (18° Celsius)."},{name:"Environmental Weakness (Cold)",effect:"Saurians are poorly suited for frigid conditions. They suffer a −4 penalty to resist cold environmental effects, and suffer +4 damage from cold-based attacks."},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."}],gear:["Body armor (+4), laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge), molecular knife (Str+d4+2, AP 2)"],description:"The lizard-like saurians come from a variety of worlds, from deserts to jungles and fetid marshes. Some communities are primitive and violent while others are enlightened and refined. The profile below represents a warrior from a society on par with Terrans."},{id:"scifi_scientist",name:"Scientist",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:2,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Academics",die:"d8"},{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Repair",die:"d8"},{name:"Research",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, personal data device"],description:"Scientists analyze the cosmos and attempt to put order to it. They’re experts in a particular field and most of its related studies as well."},{id:"scifi_scoopjaw",name:"Scoopjaw",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:12,scale:"Gargantuan",pace:8,parry:6,toughness:24,armor:4,attributes:{agility:"d8",smarts:"d8 (A)",spirit:"d8",strength:"d12+10",vigor:"d12"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"}],abilities:[{name:"Armor +4",effect:"Heavy Armor. Thick hide."},{name:"Bite",effect:"Str+d10"},{name:"Hardy",effect:"Not Wounded by a second Shaken result."},{name:"Size 12 (Gargantuan)",effect:"Over 60’ tall."},{name:"Swallow Whole",effect:"Anyone hit by a bite attack must make an Evasion roll or be Swallowed Whole. At the end of the creature’s subsequent turns, anyone swallowed must make a Vigor roll at −2 or take a Wound from the crushing gullet and acidic bile. Shaking, Wounding, or otherwise provoking the creature may result in opportunities to escape with an Athletics roll."}],description:"Scoopjaws are scaled quadrupedal, hippo- like creatures of immense size with jaws wide enough to swallow humans whole. They are truly massive—the size of six-story houses— territorial, and aggressive, especially during mating season."},{id:"scifi_scrap_parasite",name:"Scrap Parasite",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:2,scale:"Large",pace:4,parry:5,toughness:11,armor:2,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d6",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"},{name:"Survival",die:"d6"}],abilities:[{name:"Armor +2",effect:"Thick rubbery hide."},{name:"Bite",effect:"Str+d4, AP 2."},{name:"Immunity",effect:"Disease."},{name:"Infection",effect:"Victims Shaken or Wounded from a bite must make a Vigor roll at −2 or gain a Debilitating Disease."},{name:"Resilient",effect:"Scrap parasites can take one Wound before they’re Incapacitated."},{name:"Size 2",effect:"An average scrap parasite is the size of a horse, though some grow larger."},{name:"Tentacles (2)",effect:"Two tentacle actions and Reach 1. Tentacles deal Str+d4 damage. Bound or Entangled prey may be bitten as usual."}],description:"The bane of colony ships, scrapyards, factories, garbage scows, and waste processing plants, scrap parasites are fierce molluscs drawn to heaps of junk. There they consume all the organic material they can find, along with plastics and even certain metals. Living creatures make for a nice, concentrated snack! Most large spacecraft have a scrap parasite dwelling in their recycling facility or even in their sewage treatment system. If a crew member goes missing, there might be a scrap parasite on board. A scrap parasite’s body is a rubbery mass of tentacles dominated by a toothy mouth. It has three eyestalks it can use as a periscope to search for prey without emerging from cover."},{id:"scifi_scylla",name:"Scylla",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:0,scale:"Normal",pace:2,parry:6,toughness:9,armor:2,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d6",strength:"d12",vigor:"d10"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Aquatic",effect:"Pace 10."},{name:"Armor +2",effect:"Tough, rubbery skin."},{name:"Bite",effect:"Str+d4."},{name:"Chameleon",effect:"Scylla can change color or pattern as a limited free action, adding +4 to Stealth rolls."},{name:"Constrict",effect:"If a scylla succeeds at a Fighting attack with a raise, it automatically Entangles its prey."},{name:"Tentacles (4)",effect:"Four tentacle actions, Reach 5, Str+d6."}],description:"Scylla are any number of octopus-like species found throughout the galaxy. The version here is considerably stronger than those found on Earth and far more aggressive."},{id:"scifi_scylla_giant",name:"Scylla, Giant",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:12,scale:"Gargantuan",pace:2,parry:7,toughness:25,armor:6,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d6",strength:"d12+10",vigor:"d10"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d10"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Aquatic",effect:"Pace 10."},{name:"Armor +6",effect:"Heavy Armor. Tough, rubbery hide."},{name:"Chameleon",effect:"Scylla can change color or pattern as a limited free action, adding +4 to Stealth rolls."},{name:"Constrict",effect:"If a giant syclla succeeds at a Fighting attack with a raise, it automatically Entangles its prey."},{name:"Size 12 (Gargantuan)",effect:"A giant scylla is over 100’ long."},{name:"Tentacles (4)",effect:"Four tentacle actions, Reach 5, Str+d10"}],description:"Named after the legendary counterpart of the monster Charybdis, scylla are massive titanic squid-like creatures that live in the darkest depths of deep-water worlds. They are ravenous predators who will even briefly drag themselves onto land in their relentless pursuit of prey."},{id:"scifi_sentient_vehicle",name:"Sentient Vehicle",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:1,scale:"Normal",pace:6,parry:2,toughness:6,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Size 1",effect:"Setneru are slim, but eight feet tall."}],gear:["Various"],description:'Some starships, aircraft, walkers, or other vehicles have an artificial intelligence code added to their onboard computing systems. These intelligent, self-aware vehicles interact with operators just like a crew member, and often come with (or develop on their own) personality algorithms that might even include Hindrances. Mysteriously, some vehicles form sentience without the benefit of AI programming. Most of these remain quiet, listening to their hosts and continuing to learn until the time is right to reveal themselves. Science is hard-pressed to explain these anomalies, leading some to attribute it to the next step in evolution. A few sentient vehicles become malicious, making life difficult for their crews, inserting puzzling lines of code into their own programming, causing subsystems to act up, or sometimes even eradicating their crews and going rogue. Sentient vehicles use the statistics for the appropriate vehicle. The AI has a Smarts and Spirit of at least d10. Some might even have their own skills at d12 or higher. Typical skills include Academics, Battle, Driving, Electronics, Language, Notice, Persuasion, Piloting, Research, or Science. The enigmatic Setneru are slightly taller than humans, and have graceful bodies with beautiful features. Individuals are androgynous, but change their body type closer to "male" or "female" while forming a mating pair or to meet the needs of the environment. Their home world is a sandy desert planet, riddled with the ancient ruins of their own civilization and the domain of gargantuan sandsnakes. The profile below is for a typical Setneru citizen.'},{id:"scifi_shock_ray",name:"Shock Ray",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:6,toughness:5,armor:0,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d10",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Electric Discharge",effect:"As a limited free action, a shock ray can discharge a powerful electric field. Anyone within a Medium Blast Template centered on the ray must make a Vigor roll or be Stunned."},{name:"Flight",effect:"Pace 8."},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."},{name:"Tail Lash",effect:"Str+d6, AP 2, Reach 1."}],description:"Shock rays are large flying creatures from worlds with thick atmospheres or low gravity. Like Terran rays, they have triangular wings and long tails—but their tails end with electrochemical barbs which allow them to stun their prey with powerful shocks. On ocean worlds, or those with thin atmospheres or high gravity, they might be water creatures instead (Aquatic: Pace 8)."},{id:"scifi_shredder",name:"Shredder",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:7,scale:"Large",pace:10,parry:6,toughness:14,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Bite/Claws",effect:"Str+d8."},{name:"Fleet-Footed",effect:"d10 running die."},{name:"Size 7 (Large)",effect:"Shredders weigh over 6000 pounds and stand about 20’ tall."}],description:"Shredders are large lizards with muscular arms, huge teeth, and razor-sharp claws. One bite is usually enough to disable most prey. They rely on pure speed for hunting and are typically solitary creatures."},{id:"scifi_smuggler",name:"Smuggler",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:9,armor:4,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d8"},{name:"Piloting",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d8"}],abilities:[],gear:["Body armor (+4, energy skin), laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge)"],description:"Smugglers make money by taking goods where authorities don’t want them to be sold. Some are out for a quick credit; others are noble freelancers, shipping vital cargo to worlds interdicted by totalitarian governments."},{id:"scifi_soldier",name:"Soldier",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:7,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Infantry battle suit (+6), laser rifle (Range 30/60/120, Damage 3d6, RoF 3, AP 2, Cauterize, No Recoil, Overcharge), molecular knife (Str+d4+2, AP 2), 2× frag grenades"],description:"These archetypes serve for common soldiers, marines, or planetary defense forces. Other skills or Edges should be added as fits their particular environment. Grunts make up the majority of any military force or strike team."},{id:"scifi_marine",name:"Marine",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:12,armor:6,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[],gear:["Infantry battle suit (+6), laser rifle (Range 30/60/120, Damage 3d6, RoF 3, AP 2, Cauterize, No Recoil, Overcharge), molecular knife (Str+d4+2, AP 2), 2× frag grenades"," OFFICER Officers are in command of a contingent of soldiers or marines"],description:"Space marines are highly trained combatants. They serve as elite units during military actions, undertake special missions, or are assigned to duty on various spacecraft."},{id:"scifi_officer",name:"Officer",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:5,toughness:11,armor:6,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Battle",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Infantry battle suit (+6), laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge), power saber (Str+2d6)"],description:"Officers are in command of a contingent of soldiers or marines."},{id:"scifi_space_barnacle",name:"Space Barnacle",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:2,toughness:7,armor:2,attributes:{agility:"d4",smarts:"d4 (A)",spirit:"d6",strength:"d4",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Notice",die:"d4"}],abilities:[{name:"Armor +2",effect:"Hard shell."},{name:"Immobile",effect:"Space barnacles cannot move on their own. If dislodged in space, they can use their spitting attack to propel themselves away at Pace 6."},{name:"Size −1",effect:"Space barnacles are roughly the size of a tire, measuring three feet across."},{name:"Spit Acid",effect:"Space barnacles can spit acid in a Stream Template. Targets splattered with acid suffer 3d4 damage. This may be Evaded."}],description:'These tough arthropods got their start clinging to asteroids and feasting on radiation from nearby stars, but prefer the surface of spacecraft where they can also consume energy emitted from the craft itself. They might seem harmless, but a single barnacle can spawn another every week, leading to a massive cluster. The harsh chemical in their secreted adhesive gradually wears holes in the superstructure, and in large numbers their weight can interfere with a vessel’s handling. Space barnacles react to any attempt to attack or dislodge them by "spitting" concentrated acid at the aggressor.'},{id:"scifi_space_cowboy",name:"Space Cowboy",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:10,armor:4,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Gambling",die:"d4"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d6"},{name:"Riding",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[],gear:["Body armor (+4), power whip (Str+d6+d4, Parry −1, Reach 2, ignores shield bonus, may Entangle or deal +d10 damage with raise), commlink, digital binoculars, exoskeleton (Strength d12), motion detector, Stetson"],description:"Space cowboys are trained wranglers hired to capture, kill, or corral all manner of xenos. They usually haunt far-flung colonies where their services are in high demand."},{id:"scifi_space_leviathan",name:"Space Leviathan",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:24,scale:"Gargantuan",pace:10,parry:7,toughness:32,armor:0,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d8",strength:"d12+20",vigor:"d12"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d10"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d8"},{name:"Crush",effect:"A leviathan crushes an Entangled or Bound vehicle as a limited free action. It automatically inflicts a Critical Hit as its tentacles seek out and destroy sensitive parts of the ship."},{name:"Flight",effect:"Pace 12,000 MPH (Speed Rating 25)."},{name:"Hardy",effect:"A second Shaken result does not cause a Wound."},{name:"Size 24 (Gargantuan)",effect:"Leviathans grow to over 1,000’ in length."},{name:"Swallow Whole",effect:"Any creature Size 7 or smaller hit by a bite attack must make an Evasion roll or be Swallowed Whole. At the end of the creature’s subsequent turns, anyone swallowed must make a Vigor roll at −2 or take a Wound from the crushing gullet and acidic bile. Shaking, Wounding, or otherwise provoking the creature may result in opportunities to escape with an Athletics roll."},{name:"Tentacles (1)",effect:"One tentacle action and Reach 50. Tentacles deal Str+d12 damage. Bound or Entangled prey may be crushed and bitten as usual."},{name:"Unstoppable",effect:"Takes a maximum of one Wound (after Soaking) from any damaging attack unless the attacker’s Action Card is a Joker."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."}],description:"Few know what horrors lurk in the dark, cold recesses of space. Space leviathans are one such monster. The kraken-like things thrive in the vacuum, but periodically dip into atmosphere to devour planet-bound prey."},{id:"scifi_space_sargassum",name:"Space Sargassum",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:4,scale:"Large",pace:4,parry:4,toughness:16,armor:4,attributes:{agility:"d4",smarts:"d10 (A)",spirit:"d6",strength:"d12+4",vigor:"d12"},skills:[{name:"Athletics",die:"d4"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +4",effect:'The spear tree has a 6" thick layer of bark.'},{name:"Plant",effect:"Immune to paralysis, poison, puppet, slumber, Stun; doesn’t sleep."},{name:"Size 4 (Large)",effect:"The spear tree is nearly 24 feet tall."},{name:"Spears",effect:"The tree can shoot a number of spears each round, Damage Str+d6, AP 2, Range 3/6/12, RoF 5. If the attack causes a Wound, the victim is impaled as well. Budding roots begin to grow into the victim, draining nutrients back to the tree through the specialized vines, and causing an additional Str+d4 damage per round, ignoring any bonuses to Toughness from Armor. Once the victim is drained, the vine detaches. Attached vines have a Toughness of 10."}],description:'The otherwise empty voids of space might appear lifeless, but they are home to a variety of peculiar plantlife which is perfectly adapted for the vast stretches between stars. Drawing sustenance from particles blown in on interstellar winds, the sargassum forms colossal "mats" that can sometimes span several astronomical units across. The tightly woven, rubbery strands can resist high-impact collisions and are notorious for being invisible to most sensors. Before most spacers know there’s a problem, their spacecraft has become hopelessly entangled in an immense patch of the weed. Worse, the rapidly growing plants are drawn to physical objects such as asteroids or spacecraft, which serve as "anchors" for the sargassum. If the crew doesn’t act fast enough, ensnared craft can soon become hopelessly engulfed. Stories of derelict craft—and their desirable cargo— circulate the space lanes. In some instances, space sargassum patches draw in strange creatures adapted for outer space, in effect becoming microbiomes that provide food and protection. Any number of space-adapted beasts might be found in a sargassum patch, including predators, vermin, and even strange viruses. The tormented souls of those who starved or froze in the sargassum might even haunt their cold, tomb-like vessels… Space sargassum doesn’t have Traits of its own, but individual strands are usually 1" (2 yards) in thickness with Hardness 16. Fire and fire-based attacks deal +4 damage to the weed. Tendrils can move/grow at Pace 1 toward solid objects. In most cases cutting free is a Complex Dramatic Task (see Savage Worlds) to escape before the tendrils grow too thick—possibly while creatures living in the mass attack the crew! Spear trees are intelligent, ambulatory trees with numerous barbed thorns set within their trunks. The thorns are the size of spear heads, and are connected by strong vines. The tree tries to kill its victims with these spears, then drains the nutrients from the corpse.'},{id:"scifi_spit_worm",name:"Spit Worm",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:0,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d10",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d6."},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."},{name:"Spit Poison",effect:"Range 3/6/12. Anyone not wearing a sealed body suit struck by the poison must make a Vigor roll or be paralyzed for 2d6 rounds."}],description:"In deep forests of primeval worlds lurk the spit worms, large and territorial centipede- like creatures. The arthropods measure 5’ in length and are covered in soft, flexible, chitinous plates. They scuttle about on 40 clawed legs. Although it has mandibles, the spit worm’s primary mode of attack is to spit paralyzing poison. In order to do this, the worm rears up on its hind segments and curls itself into an 'S' shape. It then uncoils, firing a glob of sticky, green poison, which can reach distances of 24 yards. Spit worms are tenacious creatures, willing to face down larger predators. Their distinctive rearing 'S' shape serves as a warning to predators fancying it as a meal."},{id:"scifi_spitter",name:"Spitter",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:7,armor:2,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d8"}],abilities:[{name:"Armor +2",effect:"Scaly hide."},{name:"Bite",effect:"Str+d6."},{name:"Size −1",effect:"Spitters stand about 3' tall."},{name:"Spit Poison",effect:"Cone Template, may be Evaded. Most spitters emit Mild Poison, but some varieties may project Knockout, Lethal, or Paralyzing (GM's call)."}],description:"Spitters are temperamental mammals that spit poison at predators or anything that annoys them. They are notoriously easily annoyed."},{id:"scifi_springtail",name:"Springtail",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Bite/Claws",effect:"Str+d6."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Leaper",effect:"Double jumping distance."},{name:"Maul",effect:"A springtail scoring a raise on a Fighting roll automatically Entangles its foe, adding +2 to its bite attack on subsequent rounds."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."}],description:"Despite their innocuous name, springtails are fierce, man-sized reptilian predators that hunt in packs of 2d6. Their four vestigial limbs end in a single curved claw designed to latch onto prey rather than provide locomotion. As their name implies, springtails have a powerful tail, which they coil up and release to leap forward. When hunting, they latch onto prey and gnash at it with their powerful bite. Unlike many animals, springtails do not have individual teeth, but instead have serrated jawbones."},{id:"scifi_spy",name:"Spy",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d8"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d8"},{name:"Taunt",die:"d6"},{name:"Thievery",die:"d8"}],abilities:[],gear:["Varies with disguise, but usually a laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge) and molecular knife (Str+d4+2, AP 2)"," STALKER Little is known about the mysterious stalkers or their home world, but this starfaring species has little interest in colonization or empires","Instead, individual stalkers leave their planet on short-term missions to locate, track, and kill the most ferocious beasts in the galaxy","For stalkers, such conquests are more than just bragging rights: they have a complex honor code centered around hunting prey and claiming trophies","Stalkers are consummate warriors","They observe their prey to learn habits, leave deadly traps, and strike from the shadows","They do not speak any known language"],description:"Spies work for governments or organizations as intelligence gatherers."},{id:"scifi_stalker",name:"Stalker",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:8,toughness:13,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d10",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d4"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d10"},{name:"Healing",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d6"},{name:"Repair",die:"d6"},{name:"Science",die:"d4"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the creature adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Stealth System",effect:"A light-bending device makes the stalker difficult to detect visually. It grants a free reroll on Stealth rolls, and those trying to attack or detect the stalker do so at a −4 penalty. The effect is triggered as a free action, but is negated any round in which the stalker fires a weapon or performs an active scan (see above)."}],gear:["Light battle armor (+4), molecular spear (Str+d6+2, AP 3, Parry +1 if used twohanded, Reach 1), flechette gun (Range 12/24/48, Damage 2d4+1, RoF 3), sniper rifle (Range 50/100/200, Damage 2d12, AP 4), 6× fragmentation grenades (Range 5/10/20, Damage 3d6, MBT)"],description:"Little is known about the mysterious stalkers or their home world, but this starfaring species has little interest in colonization or empires. Instead, individual stalkers leave their planet on short-term missions to locate, track, and kill the most ferocious beasts in the galaxy. For stalkers, such conquests are more than just bragging rights: they have a complex honor code centered around hunting prey and claiming trophies. Stalkers are consummate warriors. They observe their prey to learn habits, leave deadly traps, and strike from the shadows. They do not speak any known language."},{id:"scifi_stannion",name:"Stannion",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:3,scale:"Large",pace:8,parry:6,toughness:12,armor:2,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d8",strength:"d12",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"},{name:"Survival",die:"d6"}],abilities:[{name:"Armor +2",effect:"Thick hide and fur."},{name:"Bite",effect:"Str+d10, AP 1."},{name:"Claws",effect:"Str+d6, AP 2."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Size 3",effect:"Stannions weigh over 800 pounds."}],description:"Stannions are large, cat-like predators found on planets with large grasslands and plentiful game. They have occasionally been befriended and trained as loyal companions, and more commonly fitted with override collars (see page 36) by less compassionate individuals."},{id:"scifi_starship_crew",name:"Starship Crew",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Battle",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d8"},{name:"Science",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, uniform, personal data device connected to the ship’s systems"],description:"Highly advanced vehicles need experienced crews to operate them. Below are a typical set of officers and crewmen for Large, Huge, or Gargantuan starships. Starship crews don’t generally wear armor or carry weapons unless they’re expecting a boarding action or similar trouble. Even then most rely on contingents of on-board marines. Should crew members need to fight, weapons (usually laser pistols) and body armor are dispersed from the armory. Captains are the undisputed law of the ships they command. Most are competent and charismatic or they wouldn’t be in charge of a multi-million-dollar vessel."},{id:"scifi_crew_member",name:"Crew Member",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d4"},{name:"Healing",die:"d4"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, uniform, personal data device connected to the ship’s systems"],description:""},{id:"scifi_engineer",name:"Engineer",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d10",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d8"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Repair",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, uniform, personal data device connected to the ship’s systems, tool belt, large wrench (Str+d6, improvised weapon)"],description:"Engineers are in charge of maintaining a ship’s engine, structural integrity, and other essential systems. Chief engineers are Wild Cards."},{id:"scifi_gunner",name:"Gunner",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d4"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d4"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Repair",die:"d4"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, uniform, personal data device connected to the ship’s systems"],description:""},{id:"scifi_medical_officer",name:"Medical Officer",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d4"},{name:"Healing",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d8"},{name:"Research",die:"d6"},{name:"Science",die:"d6"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"},{name:"Survival",die:"d6"}],abilities:[],gear:["Commlink, uniform, personal data device connected to the ship’s systems, medical kit, medi-scanner, 5× medi-gel"],description:"The chief medical officer on a large ship is usually a Wild Card with the Healer Edge."},{id:"scifi_pilot_navigator",name:"Pilot/Navigator",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"}],abilities:[],gear:["Commlink, uniform, personal data device connected to the ship’s systems"],description:""},{id:"scifi_stomper",name:"Stomper",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:4,scale:"Large",pace:8,parry:6,toughness:13,armor:2,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d8",strength:"d12+3",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"}],abilities:[{name:"Armor +2",effect:"Thick hide."},{name:"Size 4 (Large)",effect:"Stompers are nearly 20 feet tall with feet the size of large tree trunks."},{name:"Stomp",effect:"Strength+d10. Nonrigid armor (leather, spacesuits) offers no protection against the stomp."}],description:"Stompers are bipedal carnivores with thick, elephant-like legs, no arms, a short neck, and a small mouth. Unable to bite prey effectively, they attack by stomping it to death and then chewing on the tenderized flesh. Stompers signal each other by stomping the ground."},{id:"scifi_stryder",name:"Stryder",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:1,scale:"Normal",pace:8,parry:4,toughness:7,armor:0,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d6",strength:"d12",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d4."},{name:"Endurance",effect:"Stryders can maintain a full run for 30 minutes without difficulty. Each 10 minutes after this, they must make a Vigor roll or suffer Fatigue. One level of Fatigue is recovered for every 30 minutes of rest."},{name:"Size 1",effect:"Stryders stand 8’ tall."}],description:"Stryders are docile, two-legged, herbivorous lizards used as mounts by many species. They have no arms. Although they stand upright when walking or trotting, they lower their heads and extend their tails when running so that their head, back, and tail form a straight line."},{id:"scifi_throxian",name:"Throxian",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:15,scale:"Gargantuan",pace:6,parry:4,toughness:29,armor:6,attributes:{agility:"d4",smarts:"d4",spirit:"d4",strength:"d12+12",vigor:"d12"},skills:[{name:"Athletics",die:"d4"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Shooting",die:"d10"}],abilities:[{name:"Armor +6",effect:"Heavy Armor. Thick carapace."},{name:"Fearless",effect:"Bombards are immune to Fear and Intimidation."},{name:"Fireball",effect:"Bombards fire a white-hot ball of burning goo (Range 200/400/800, Damage 6d6"},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Hive Mind",effect:'Throxians can communicate with others of their kind within 5" (10 yards).'},{name:"Night Vision",effect:"Bombards ignore all Illumination penalties."},{name:"Resilient",effect:"Bombards can take one additional Wound before they’re Incapacitated."},{name:"Size 15 (Gargantuan)",effect:"Bombards tower 200 feet high and weigh over four thousand tons."},{name:"Stomp",effect:"Str+d10"},{name:"Tireless",effect:"Immune to Fatigue."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."}],description:'The galaxy is filled with insect-like creatures, but none pose a threat like the intelligent insects of Throx 3. Quick, clever, aggressive, and bent on expanding their hold on space, the Throxians resent incursions by other species on star systems they’ve claimed, meeting all perceived threats (warranted or not) with relentless hostility. Despite their comparable intellect, the Throxians have never developed tools. Instead they use careful selective breeding to alter the forms of other creatures native to their planet, then employ those abilities for space travel, defense, and any other needs. All Throxians are mentally connected through their hive mind, allowing them to freely communicate with any other Throxian within 5" (10 yards), or many miles if within range of an enceph (see below). These titanic Throxians have a special gland that constantly creates a searing-hot chemical mix. Though naturally peaceful, when directed by an enceph or commanding soldier they can fire a huge, burning chemical ball from their snouts as artillery.'},{id:"scifi_throxian_enceph",name:"Throxian Enceph",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:6,scale:"Large",pace:2,parry:2,toughness:11,armor:0,attributes:{agility:"d4",smarts:"d12",spirit:"d8",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d4"},{name:"Battle",die:"d8"},{name:"Common Knowledge",die:"d10"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Psionics",die:"d8"},{name:"Science",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d6"}],abilities:[{name:"Hive Mind Focus",effect:"An enceph’s huge brain extends the Throxian Hive Mind capability, connecting all individuals within the enceph’s Smarts in miles."},{name:"Size 6 (Large)",effect:"Encephs are as large as elephants and weigh around eight tons."},{name:"Slow",effect:"Encephs can only move by contracting their muscles, much like a slug. They move at Pace 2 and cannot run."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."}],description:"While the average Throxian is intelligent, it’s the encephs who make most of the plans and function as the psychic link for the entire hive. Bred specifically for their advanced intellect, encephs never molt into their adult form. Instead they appear as extremely large pupae, albeit with an immense brain visible beneath their translucent skin. The profile below is for an average enceph assigned to a forward exploration or assault squadron. Other, more powerful encephs exist on established Throxian worlds."},{id:"scifi_throxian_soldier",name:"Throxian Soldier",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:6,toughness:6,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d6."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Hive Mind",effect:'Throxians can communicate with others of their kind within 5" (10 yards).'},{name:"Leaper",effect:"Double jumping distance."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Resilient",effect:"Can take one additional Wound."},{name:"Spike",effect:"Str+d8, AP 1. A hit with a raise Entangles the victim."},{name:"Tireless",effect:"Immune to Fatigue."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."},{name:"Wall Walker",effect:"Soldiers may cling to vertical and inverted surfaces and move at their standard Pace."}],description:"Soldiers are bred to be perfect warriors— indefatigable, unafraid of danger, and utterly devoted to the protection of the hive. Each of their four articulated limbs ends in a wicked spike. One in twenty soldiers also has wings (Flight: Pace 10). Soldiers are immune to the effects of a vacuum and can operate in open space without protection."},{id:"scifi_throxian_worker_drone",name:"Throxian Worker Drone",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:6,armor:0,attributes:{agility:"d8",smarts:"d4",spirit:"d8",strength:"d10",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d4."},{name:"Hive Mind",effect:'Throxians can communicate with others of their kind within 5" (10 yards).'},{name:"Tireless",effect:"Immune to Fatigue."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."},{name:"Wall Walker",effect:"Worker drones may cling to vertical and inverted surfaces and move at their standard Pace."}],description:"Throxian hives depend on the labor of their worker drones, who work tirelessly until they drop dead. Worker drones are immune to the effects of a vacuum and can operate in open space without protection."},{id:"scifi_thug",name:"Thug",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:0,attributes:{agility:"d6",smarts:"d4",spirit:"d6",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[],gear:["Heavy club (Str+d6)","Many might carry various types of firearms as well"],description:"Big, dumb, and strong, thugs are hired muscle. Most operate in gangs where they can rely on their fellows for support. They are usually reluctant to pursue a fight they are losing, and are most likely to withdraw, threatening to return at a later date and even the score."},{id:"scifi_titan_eel",name:"Titan Eel",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:12,scale:"Gargantuan",pace:"—",parry:7,toughness:20,armor:0,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d6",strength:"d12+10",vigor:"d12"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d6"}],abilities:[{name:"Aquatic",effect:"Pace 10."},{name:"Bite",effect:"Str+d10"},{name:"Electric Shock",effect:'Some species of titan eel can discharge electricity. Once per encounter, this attack causes 5d6 damage to everything within 5" (10 yards) of the creature. Only sealed Heavy Armor offers protection.'},{name:"Size 12 (Gargantuan)",effect:"Titan eels can reach lengths of over 100’ long and weigh hundreds of tons."}],description:"A number of worlds are home to massive eel- like creatures with teeth the size of swords. Some species may also discharge stored electrical energy to stun nearby prey."},{id:"scifi_umbrella_beast",name:"Umbrella Beast",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:8,scale:"Huge",pace:2,parry:5,toughness:13,armor:0,attributes:{agility:"d4",smarts:"d6 (A)",spirit:"d8",strength:"d12+5",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d8"}],abilities:[{name:"Burrow",effect:"Umbrella beasts are not true burrowers, but conceal themselves beneath soft earth, leaving only their eyestalks just above the surface."},{name:"Digestion",effect:"Prey caught in an umbrella beast’s fleshy folds are slowly dissolved. An Entangled or Bound victim suffers 2d6 damage at the start of each of his turns."},{name:"Size 8 (Huge)",effect:"Umbrella beasts measure 25’ across."}],description:"Large bony “arms” connected by fleshy skin and tipped with multi-pronged horns rise from the body of this aptly named xeno. Umbrella beasts are opportunists, lying just beneath the surface of soft soil or sand and waiting for prey to walk across them. When attacking, the “arms” burst through the light covering, enveloping the unsuspecting quarry in the fleshy folds. The horns are not used to attack, but interlock to prevent the prey from easily escaping. Trapped creatures are then subjected to powerful enzymes, which dissolves their flesh. The resultant goo flows down the skin flaps into the beast’s waiting mouth."},{id:"scifi_uslen",name:"Uslen",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:2,scale:"Large",pace:4,parry:4,toughness:8,armor:0,attributes:{agility:"d4",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d8"},{name:"Fighting",die:"d4"},{name:"Gambling",die:"d10"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d8"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"},{name:"Taunt",die:"d8"},{name:"Thievery",die:"d8"}],abilities:[{name:"Acid Biology",effect:"When an uslen suffers a Wound, everyone within a Small Blast Template must roll Evasion or suffer 2d6 damage. Suffering two Wounds increases the damage to 3d6, and three or more Wounds douse unfortunates with 4d6 damage. The species is immune to their own acid, but not other types."},{name:"Alien Form",effect:"The uslen have a size and shape incompatible with most equipment and vehicles available. Weapons and vehicles suffer a −1 penalty to operate and armor doesn’t fit at all."},{name:"Reduced Pace",effect:"As they have no legs, uslen crawl along at Pace −1, and have a d4 running die."},{name:"Repugnant",effect:"Reactions (see Savage Worlds) are always either Unfriendly or rolled on 1d6 instead of 2d6 if determined randomly. A roll of 1 is treated as Hostile, plus the unfortunate becomes physically ill."},{name:"Size 2",effect:"An uslen can reach upward of 9’ long and weigh over 1200 lbs."}],description:"Repulsive to most other species, the uslen are huge, slug-like beings who hail from a swampy home world. Their ruthless social structure encourages deception and opportunism, but many also have exceptional skill at bargaining, making them natural-born business owners. Their size and body shape make them lackluster fighters. For this reason they tend to surround themselves with well- paid, loyal bodyguards and trained attack animals. The profile below is for a typical uslen crime boss."},{id:"scifi_voidling",name:"Voidling",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:7,armor:2,attributes:{agility:"d6",smarts:"d8",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Stealth",die:"d8"},{name:"Survival",die:"d6"}],abilities:[{name:"Bloodless",effect:"Voidlings automatically stabilize whenever they would Bleed Out."},{name:"Cannot Speak",effect:"Unless aided by devices, voidlings can understand other languages but may only communicate with members of their own culture."},{name:"Energy Form",effect:"Voidlings have no vital organs and ignore Called Shots, take no damage from falling, collisions, or physical weapons and projectiles (they take full damage from energy weapons, explosions, arcane attacks, etc.). Voidlings can’t wear armor, use weapons, or manipulate matter unless they wear a containment suit."},{name:"Separation Disorder",effect:"Subtract 2 from Spirit rolls when there are no other voidlings present."},{name:"Spacer",effect:"Voidlings don’t breathe and can survive in the vacuum of space."}],gear:["Containment suit (+2), lan - guage translator"],description:"The enigmatic voidlings evolved in the depths of space. They come in a variety of shapes and appearances, but the profile below is for a voidling with a roughly humanoid shape."},{id:"scifi_wire_rat",name:"Wire Rat",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:3,armor:0,attributes:{agility:"d10",smarts:"d8 (A)",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d10"}],abilities:[{name:"Bite",effect:"Str+d4."},{name:"Leaper",effect:"Double jumping distance."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Size −2 (Small)",effect:"Wire rats are bigger than rats and much stockier."}],description:"Wire rats are rodents that have developed a taste for electrical wiring. Once on board a vehicle or starship, they waste no time in chewing through any wiring they can find."},{id:"scifi_xerin",name:"Xerin",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:1,scale:"Normal",pace:6,parry:5,toughness:7,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"}],abilities:[{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Immunity",effect:"Xerins aren't affected by poisons."},{name:"Size 1",effect:"Xerins are well over 6’ tall, with long, sinewy limbs."}],gear:["Body armor (+2), knife (Str+d4), spear (Str+d6, Parry +1)"],description:"Xerins are sapient, relatively primitive humanoids from a planet called Xeris V. They have an innate distrust of technology, and where their tribes collide with more advanced societies they tend to be aggressive saboteurs."},{id:"scifi_xok_xok",name:"Xok-Xok",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:5,parry:4,toughness:4,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d4"},{name:"Electronics",die:"d8"},{name:"Fighting",die:"d4"},{name:"Hacking",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Repair",die:"d8"},{name:"Science",die:"d4"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"},{name:"Thievery",die:"d6"}],abilities:[{name:"Low Light Vision",effect:"Ignore penalties for Dim and Dark Illumination."},{name:"Reduced Pace",effect:"Xok-xok have small legs. Pace −1, and d4 running die."},{name:"Size −1",effect:"Xok-xok stand three feet tall and weigh 100 pounds."}],gear:["Stun baton (Str+d4, Stun), laser rifle (Range 30/60/120, Damage 3d6, AP 2, RoF 3, Cauterize, No Recoil, Overcharge), EMP grenade (Range 5/10/20, Damage 4d6 nonlethal against electronic devices only)"],description:"The xok-xok are small humanoids from Druzkan II, a rocky world near the galactic core. This central location places their planet near many space lanes, but as it lacks any viable resources of its own, Druzkan II has become a convenient place to sell unwanted or nonfunctional bits of technology. Their natural talent for repairing tech has allowed the xok-xok to prosper in these conditions. A typical xok-xok has at least one functioning labor bot (see page 136) it rebuilt from scraps."},{id:"scifi_yeti",name:"Yeti",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:2,scale:"Large",pace:6,parry:5,toughness:7,armor:0,attributes:{agility:"d8",smarts:"d4",spirit:"d6",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"}],abilities:[{name:"Big",effect:"Yetis subtract 2 from Trait rolls when using equipment that wasn’t specifically designed for their form and cannot wear armor or clothing that wasn't made for them."},{name:"Environmental Resistance (Cold)",effect:"Yetis add +4 to resist the effects of cold, and reduce damage from cold- and ice-based attacks by 4."},{name:"Environmental Weakness (Heat)",effect:"Yetis subtract 4 from Fatigue checks made to resist the effects of heat, and take 4 additional points of damage from heatand fire-based attacks."},{name:"Size 2",effect:"Yetis are around seven feet tall, very broad, and very dense."}],gear:["None, though some may have a knife (Str+d4) or spear (Str+d6, Reach 1, Parry +1 if used two-handed)"],description:'The term "yeti" applies to any breed of fur- covered mammalian beings. Yetis almost always hail from cold worlds, are hairy, and are ferocious when threatened.'},{id:"scifi_zombie",name:"Zombie",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:5,toughness:8,armor:1,attributes:{agility:"d6",smarts:"d6",spirit:"d4",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Piloting",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Claws",effect:"Str."},{name:"Fearless",effect:"Zombies are immune to Fear and Intimidation."},{name:"Undead",effect:"+2 Toughness; +2 to recover from being Shaken; no additional damage from Called Shots; ignores 1 point of Wound penalties; doesn’t breathe; immune to disease and poison."},{name:"Weakness (Head)",effect:"Called Shots to a zombie’s head do the usual +4 damage."}],gear:["Spacesuit (+1), laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge)"],description:"Zombies don’t have to be supernatural in origin. Even in a hard sci-fi campaign, they might be victims of a strange alien force that reanimates the dead, a virus, or they might even be inhabited by parasitic aliens that somehow tap into the corpse’s neural system. For typical zombies, use the profile in Savage Worlds. These nightmares were once human astronauts who met a horrific end. Their decaying, desiccated, or vacuum-blacked bodies are still trapped in their spacesuits, and they gaze out through cracked visors with eerily sentient eyes."},{id:"scifi_parasite_zombie",name:"Parasite Zombie",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:6,toughness:7,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d4",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Claws",effect:"Str."},{name:"Fearless",effect:"Zombies are immune to Fear and Intimidation."},{name:"Poor Senses",effect:"Parasite zombies are at −4 to detect motionless creatures or those using Stealth and moving no faster than Pace 1."},{name:"Undead",effect:"+2 Toughness; +2 to recover from being Shaken; no additional damage from Called Shots; ignores 1 point of Wound penalties; doesn’t breathe; immune to disease and poison."},{name:"Weakness (Head)",effect:"Called Shots to a zombie’s head do the usual +4 damage."}],gear:["None, though some may still be wearing spacesuits or armor"],description:"Arguably more horrific than supernatural undead, parasite zombies are created when a parasitic organism attaches itself to a human host. It then burrows into the host’s brain, taking control of their actions. Whether the host is still living or not, it functions just like an undead zombie. In most cases, killing the parasite also results in the immediate death of the host. Parasites with this ability come in a wide variety of shapes and sizes, from microscopic viruses to large crab- or insect-shaped beasts which can move about in search of victims."},{id:"scifi_the_collective",name:"The Collective",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:10,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Battle",die:"d4"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Hacking",die:"d6"},{name:"Healing",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d6"},{name:"Repair",die:"d6"},{name:"Science",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Construct",effect:"+2 to recover from being Shaken; ignores 1 point of Wound penalties; doesn’t breathe or suffer from disease or poison."},{name:"Hive Mind",effect:'Can communicate with other assimilators within 5" (10 yards).'},{name:"Inhuman",effect:"Assimilators are not subject to Strain or side effects from cyberware."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the assimilator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."}],gear:["Personal force field (+4 Toughness), blaster rifle (Range 24/48/96, Damage 2d8+2, AP 2)","Installed cyberware: Attribute increase (all attributes), enhanced hearing, enhanced vision, hardy, integrated gear, redundant organs, targeting system, threat analyzer"],description:'The assimilators known only as the collective hail from a distant quadrant of the galaxy. No one knows what they once looked like, only that they are a massive hive mind, growing their empire by seizing humanoids of any kind and "assimilating" them through a horrific process that breaks their individuality as it fuses them with technology. To find new vessels, assimilators send colony ships into the fringes of space claimed by other empires. When the collective takes heavy losses in a battle, they are particularly keen on capturing and assimilating the friends and loved ones of any heroes who distinguished themselves during that fight. Seeing a former ally who has been assimilated is sure to trigger a Fear check! All "constituents" are trained to perform any function needed by the collective, and are virtually indistinguishable from one another. This profile is for a constituent who was once human. AAppendix ppendix AA:: EEmpiresmpires'},{id:"horror_shoggoth",name:"Elder Shoggoth",subtitle:"Amorphous Protoplasmic Abomination",sourcebook:"Horror Companion",classification:"Aberration",isWildCard:!0,size:5,scale:"Huge",pace:7,parry:6,toughness:18,armor:4,attributes:{agility:"d6",smarts:"d8",spirit:"d12",strength:"d12+5",vigor:"d12"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d12+2"},{name:"Notice",die:"d10"}],abilities:[{name:"Mind-Shattering Terror (-4)",effect:"Witnessing a shifting mass of eyes, teeth, and bubbling slime forces a Fear test at -4."},{name:"Amorphous Anatomy",effect:"No distinct organs or anatomy; immune to Called Shots, piercing damage bonus, and decapitation."},{name:"Engulf & Crush",effect:"May flow over targets in a Large Blast Template; victims suffer 3d6 crushing damage per round."},{name:"Pseudopod Slap",effect:"Str+d8 damage, Reach 3, Heavy Weapon."},{name:"Size +5",effect:"Weighs dozens of tons; gains +5 Toughness and Huge scale (+2 to be hit)."}],description:"A terrifying, shifting mound of black iridescence and pustules, chanting alien phonemes as it crushes everything.",tactics:"Oozes relentlessly forward, rolling over barricades and engulfing entire squads into its acidic digestive mass.",habitat:"Antarctic vaults, sunken oceanic ruins, and cosmic voids."},{id:"horror_wendigo",name:"Wendigo",subtitle:"Hunger of the Frozen Dark",sourcebook:"Horror Companion",classification:"Monstrosity",isWildCard:!0,size:2,scale:"Large",pace:10,parry:8,toughness:13,armor:2,attributes:{agility:"d10",smarts:"d8",spirit:"d10",strength:"d12+2",vigor:"d12"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d12"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d12"}],abilities:[{name:"Blizzard Aura",effect:'Freezin
