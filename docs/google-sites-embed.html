ursuing its prey for hours or even days, sometimes only relenting if another, less challenging meal presents itself."},{id:"scifi_aquarian",name:"Aquarian",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:0,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Stealth",die:"d6"},{name:"Taunt",die:"d6"}],abilities:[{name:"Aquatic",effect:"Pace 6."},{name:"Atmospheric Dependency",effect:"Aquarians need to breathe water in order to survive. Those without a rebreather (or spacesuit if the pressure is too low) must make a Vigor check every round or suffer a Fatigue level that can lead to death. Recovery is only possible when the character receives water at standard pressure and one Fatigue level is recovered every 10 minutes."},{name:"Poisonous Touch",effect:"With a successful unarmed attack, the aquarian may opt to target the victim with Paralyzing Poison (see Savage Worlds)."},{name:"Toughness +1",effect:"Life in the depths makes aquarians resilient."}],gear:["Molecular spear (Str+d6+2, AP 3, Reach 1, Parry +1 if used two-handed)"],description:"This profile includes most types of water- dwelling humanoids, such as those from aquatic planets."},{id:"scifi_arc_beetle",name:"Arc Beetle",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:2,scale:"Large",pace:6,parry:5,toughness:11,armor:3,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d8",strength:"d10",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Armor +3",effect:"Thick shell."},{name:"Bite",effect:"Str+d4."},{name:"Electricity",effect:"Arc beetles fire bolts of electricity from their antennae. This attack uses Shooting. Range 6/12/24, Damage 3d6, AP 2."},{name:"Size 2",effect:"Arc beetles are over 6’ long and 4’ high."}],description:"Arc beetles are armored insects with a distinctive yellow and blue striped shell. Protruding from their forehead are two long antennae that crackle with bioelectrical energy and can throw bolts of electricity to a range of over 45 yards."},{id:"scifi_assassin",name:"Assassin",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:9,armor:4,attributes:{agility:"d10",smarts:"d6",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d8"},{name:"Thievery",die:"d8"}],abilities:[],gear:["Body armor (+4), power short sword (Str+d6, powered), laser rifle (Range 30/60/120, Damage 3d6, RoF 3, AP 2, Cauterize, No Recoil, Overcharge)"," MASTER ASSASSIN"],description:"Assassins are hired killers. They may be loners or belong to an organized guild or government agency. What they generally have in common is a lack of scruples about killing for money, though a rare few might slay in the name of a cause—righteous or not."},{id:"scifi_master_assassin",name:"Master Assassin",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:9,toughness:10,armor:4,attributes:{agility:"d10",smarts:"d8",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d12"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d12"},{name:"Thievery",die:"d8"}],abilities:[],gear:["Body armor (+4), energy sword (Str+d8 (I), AP 4, HW), laser rifle (Range 30/60/120, Damage 3d6, RoF 3, AP 2, Cauterize, No Recoil, Overcharge)","Installed cyberware: Face changer, skill bonus (enhanced reflexes, Fighting +2), skill bonus (targeting eye, Shooting +2)"],description:""},{id:"scifi_assimilator",name:"Assimilator",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:8,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Battle",die:"d4"},{name:"Common Knowledge",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Hacking",die:"d6"},{name:"Healing",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d6"},{name:"Repair",die:"d6"},{name:"Science",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Assimilated",effect:"+ 2 Toughness; +2 to recover from being Shaken; no additional damage from Called Shots; ignores 1 point of Wound penalties; doesn’t breathe; immune to disease and poison. Immune to Fear, Intimidation, and Taunt."},{name:"Hive Mind",effect:'Can communicate with other assimilators within 5" (10 yards).'},{name:"Inhuman",effect:"Assimilators are not subject to Strain or side effects from cyberware."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the assimilator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."}],gear:["Blaster rifle (Range 25/50/100, Damage 3d6+2, AP 2)","Installed cyberware: Attribute increase (all attributes), enhanced hearing, enhanced vision, hardy, redundant organs, targeting system, threat analyzer, integrated gear (blaster rifle)"],description:'Assimilators are an emotionless, calculating, coldly efficient species of cybernetic organisms. They multiply by capturing enemies and then forcibly incorporating— "assimilating"—them into the colony in a harrowing operation which infuses their body with a variety of crude cybernetic enhancements, breaking their mind and spirit in the process. The new member becomes linked to the collective hive mind, and can share and access knowledge with other members of the colony. Any intelligent creature can be made into an assimilator by increasing each of its attributes one die type and adding the following Special Abilities. Assimilators also lose all Hindrances but retain any Edges and skills. Regardless of species, assimilators appear pale and lifeless as though freshly dead, and are completely expressionless. Assimilators are coldly rational and do not understand emotions, nor do they understand abstract concepts like metaphors, honor, fate, etc. to recover from being Shaken; no additional damage from Called Shots; ignores 1 point of Wound penalties; doesn’t breathe; immune to disease and poison. Immune to Fear, Intimidation, and Taunt. assimilators within 5" (10 yards). and other sensors ignore Illumination penalties. If it scans as an action, the assimilator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards. This profile is for a typical assimilator, who performs a variety of functions for the colony.'},{id:"scifi_avion",name:"Avion",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:5,parry:5,toughness:9,armor:4,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Taunt",die:"d6"}],abilities:[{name:"Flight",effect:"Pace 6."},{name:"Frail",effect:"−1 Toughness."},{name:"Reduced Pace",effect:"Pace –1 and running die reduced one step on the ground."}],gear:["Body armor (+4), blaster pistol (Range 12/24/48, Damage 2d6+2, AP 2), vibro blade (Str+d6+d4, AP 2)"],description:"Avions are winged humanoids who dwell on gas giants, planets with low gravity, or other lofty environments."},{id:"scifi_avrok",name:"Avrok",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:6,scale:"Large",pace:6,parry:6,toughness:15,armor:2,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d8",strength:"d12+2",vigor:"d10"},skills:[{name:"Athletics",die:"d12"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d4"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d8"},{name:"Survival",die:"d8"}],abilities:[{name:"Aquatic",effect:"Pace 12."},{name:"Armor +2",effect:"Thick hide."},{name:"Bite",effect:"Strength+d8."},{name:"Shake",effect:"If the beast hits with a raise on a bite attack, it shakes its powerful head back and forth violently, dealing +2d6 bonus damage instead of the usual +1d6."},{name:"Size 6 (Large)",effect:"Avroks measure 35’."}],description:"The avrok is a massive crocodilian creature found on more primitive worlds with plentiful game."},{id:"scifi_barbed_tongue_lizard",name:"Barbed-Tongue Lizard",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:4,scale:"Large",pace:10,parry:8,toughness:9,armor:0,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d4",strength:"d12+1",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d12"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bite",effect:"Str+d8."},{name:"Fleet-Footed",effect:"d10 running die."},{name:"Low Light Vision",effect:"No penalties for Dim and Dark lighting."},{name:"Size 4 (Large)",effect:"Barbed-tongues weigh 2000 pounds."},{name:"Tongue",effect:"Str+d4, Reach 2. The tongue is tipped with bony barbs that deliver a pain-causing poison. Anyone Shaken or Wounded must make a Vigor roll or be Stunned."}],description:"Barbed-tongue lizards get their name from the sharp bony “teeth” at the end of their long tongue. The barbs deliver a poison which causes immense pain but little physical harm. Some aggressive species use this to stun and eat their prey, while others use it to escape. Barbed-tongue lizards have dark red scales they can flush with blood to turn bright red and startle potential threats."},{id:"scifi_batspider",name:"Batspider",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:5,toughness:2,armor:0,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d8",strength:"1",vigor:"d6"},skills:[{name:"Athletics",die:"d4"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Backbiter",effect:"If a batspider has Surprise, it flies onto its opponent’s back and attacks with The Drop. The victim suffers a −2 penalty to attack the creature until it’s Shaken or Wounded, at which point it detaches and attacks normally (or flees)."},{name:"Flight",effect:"Pace 8."},{name:"Poison Bite (−2)",effect:"Batspiders can’t cause true damage with their bite and thus can’t penetrate armor, but they seek out bare skin or light clothing, making a Called Shot if necessary. With a successful Fighting roll as a Touch Attack (+2) they manage to bite and deliver their poison. Victims must make a Vigor roll at −2 (−4 if it hit with a raise) or suffer 2d4 damage at the start of each subsequent round."},{name:"Size −3 (Very Small)",effect:"Batspiders are six inches in diameter."},{name:"Wall Walker",effect:"Batspiders can move across vertical or horizontal surfaces at their Pace."}],description:"Batspiders are a species of flying arachnids. Each spider is about six inches across with two sets of bat-like wings extending from its back. Batspiders commonly dwell in forests or jungles, swooping down from trees to land on their prey’s back. They are often found as solitary hunters, though sometimes as many as a dozen gather together. They never form true swarms."},{id:"scifi_bleeder_rabbit",name:"Bleeder Rabbit",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:1,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d10",strength:"d4",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +1",effect:"Scaly skin."},{name:"Bite",effect:"Str+d4."},{name:"Leaper",effect:"Double jumping distance."},{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Rending Attack",effect:"Victims Shaken or Wounded by a bite must make a Vigor roll as a free action at the beginning of each next turn until they roll a raise, suffering a Wound with each failure."},{name:"Size −1",effect:"Bleeders stand 3’ in height."}],description:"Imagine a rabbit the size of a small child covered with scaly skin like that of an armadillo. Then enlarge its teeth to the length of an adult human’s index finger. That’s a bleeder rabbit—or bleeder bunny as some crews prefer. Despite their relatively small size, bleeder bunnies can kill much larger prey with a single bite. Their saliva acts as an anticoagulant, preventing the deep wound from clotting. All the bunny has to do is make one bite, then flee to a safe distance and wait for its prey to slowly bleed to death."},{id:"scifi_bone_spider",name:"Bone Spider",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:6,armor:2,attributes:{agility:"d10",smarts:"d6 (A)",spirit:"d8",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Armor +2",effect:"Bony shell."},{name:"Bite",effect:"Str+d6."},{name:"Fear (−2)",effect:"They are nightmarish creatures."},{name:"Paralysis",effect:"Anyone Shaken or Wounded by a bone spider must make a Vigor roll or be paralyzed for 2d6 rounds."},{name:"Size −2 (Small)",effect:"Bone spiders are the same size as human heads with 12-inch-long legs."}],description:"Bone spiders are nightmarish creatures from desolate worlds. They have bodies the size of a man’s head, 12-inch-long legs, and are covered in black, segmented, bony armor. At the end of their extendable jaws are four sharp fangs surrounding a circular mouth filled with teeth capable of cutting through bone. It’s a flesh eater and willing to attack opponents much larger than itself."},{id:"scifi_bounty_hunter",name:"Bounty Hunter",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:10,armor:4,attributes:{agility:"d8",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"},{name:"Taunt",die:"d6"}],abilities:[],gear:["Body armor (+4), blaster rifle (Range 25/50/100, Damage 3d6+2, AP 2), molecular knife (Str+d4+2, AP 2), 3× stun grenades, stun baton (Str+d4, stun charge), handcuffs, commlink"," ELITE BOUNTY HUNTER"],description:"Bounty hunters serve as a form of intergalactic police, hunting down criminals where governments have no jurisdiction. Some respect local laws and cooperate with law enforcement agencies. Others use whatever methods they deem necessary to catch their quarry."},{id:"scifi_elite_bounty_hunter",name:"Elite Bounty Hunter",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!0,size:0,scale:"Normal",pace:6,parry:6,toughness:10,armor:4,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Common Knowledge",die:"d8"},{name:"Driving",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d8"},{name:"Piloting",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"},{name:"Taunt",die:"d6"}],abilities:[],gear:["Body armor (+4), blaster rifle (Range 25/50/100, Damage 3d6+2, AP 2), molecular knife (Str+d4+2, AP 2), 3× stun grenades, stun baton (Str+d4, stun charge), handcuffs, commlink"],description:""},{id:"scifi_brain_eater",name:"Brain Eater",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:6,armor:2,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d8",strength:"d12",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d12"}],abilities:[{name:"Armor +2",effect:"Hard, plastic-like carapace."},{name:"Bite",effect:"Str+d4. +2 to Athletics and Strength rolls made to grapple."},{name:"Immunity",effect:"Acid."},{name:"Low Light Vision",effect:"Ignore penalties for Dim and Dark Illumination."},{name:"Mimicry",effect:"Observers are at −4 on Notice rolls to distinguish a brain eater from a real helmet."},{name:"Poison (−2)",effect:"Brain eaters inject their prey with a numbing agent that prevents them from speaking but allows them to move and act normally (though with no memory of the attack). After a number of hours equal to half the victim’s Smarts, they perish."},{name:"Size −3 (Very Small)",effect:"The typical brain eater is the same size, shape, and weight as an astronaut’s helmet."},{name:"Slow Regeneration",effect:"A brain eater makes a natural healing roll once per day to recover from its Wounds."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."},{name:"Very Resilient",effect:"Brain eaters can take two Wounds before being Incapacitated."}],description:"These nightmarish creatures look, to the casual eye, exactly like a space helmet. But when placed on the head they clamp their jaw down on the unsuspecting victim and stun them with a powerful numbing agent. As if sleepwalking, the victim can continue to move around for a few hours and even perform tasks—all while the horror gradually digests his brain! When the victim finally dies, the brain eater releases the body and skitters off on tiny, retractable legs to find a new hiding place and repeat the process. How these things evolved, or where they came from, remains a mystery. In fact, the mere existence of these horrors is heavily disputed, though just about every pub in the space lanes has a jockey who swears he knew a guy who knew a guy, etc. Brain eaters that take on other forms—such as gloves, spacesuits, sleeping bags, or even entire rooms—might certainly exist."},{id:"scifi_brainiac",name:"Brainiac",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:7,armor:4,attributes:{agility:"d6",smarts:"d8",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Battle",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Electronics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d6"},{name:"Science",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Taunt",die:"d6"}],abilities:[{name:"Atmospheric Dependency",effect:"Brainiacs treat all atmospheres (other than their own) as Hazardous. Those without a spacesuit or rebreather must make a Vigor roll every hour or suffer Fatigue."},{name:"Sickly",effect:"Brainiacs are especially susceptible to foreign diseases. They subtract 2 from any Vigor roll made to resist or recover from disease."},{name:"Size −1",effect:"Brainiacs are four feet tall."},{name:"Squishy",effect:"Brainiacs have tender bodies and exposed brains. Their Toughness is reduced by 1."},{name:"Tentacles (4)",effect:"In their true form brainiacs have four tentacle actions and Reach 1."}],gear:["Armored spacesuit (+4), laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge), personal force field (+4), atmosphere recycler"],description:'The aliens called "brainiacs" have a different name for their own species, but earned their nickname from their terrifying appearance— akin to a zombie with an outsized, external brain—and their borderline sadistic aggression. In their normal form they look like humanoids inside specially built spacesuits. However, if the suit is damaged, the brainiacs reveal their true shape: an octopus-like creature comprised of a huge brain, bulbous eyestalks, and a dozen whiplike tentacles. Brainiac spacecraft are shaped like discs or manta rays, and their infantry-support walkers (see page 179) utilize three tall legs. In some campaigns, brainiacs might also employ Psionics or Weird Science devices.'},{id:"scifi_bristled_gorer",name:"Bristled Gorer",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:0,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d6",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Pounce",effect:"+4 damage instead of +2 when making a Wild Attack."},{name:"Tusks",effect:"Str+d6."}],description:"Bristled gorers are herbivores that use their four sharp tusks to dig up roots and tubers. Although predominantly flat, their teeth and jaws are more than capable of crushing thick fibers. They are quadrupedal and covered in short fur, which stands on end when the creature is startled, and almost doubles its effective size. The flesh of a gorer is extremely tasty, and native beings hunt them. Despite being herbivorous, gorers are aggressive when provoked and their tusks are quite capable of slicing through flesh and bone."},{id:"scifi_citizen",name:"Citizen",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:2,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Items appropriate to their trade","Some have a simple firearm or knife (Str+d4)"],description:"Citizens are crafters, miners, shop owners, farmers, and far more. They know their trade and have little interest in much else. They tend to stick to their business and their families."},{id:"scifi_corporate_executive",name:"Corporate Executive",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:2,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Academics",die:"d6"},{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Research",die:"d6"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"},{name:"Taunt",die:"d6"}],abilities:[],gear:["Suit, personal data device"],description:"Corporate executives keep the wheels of industry turning—and have a taste for money and power. In dangerous worlds, most are attended by at least one bodyguard."},{id:"scifi_senior_executive",name:"Senior Executive",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:2,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Academics",die:"d8"},{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d8"},{name:"Research",die:"d8"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d6"},{name:"Taunt",die:"d6"}],abilities:[],gear:["Expensive suit, personal data device"],description:"Senior executives are decision makers at the highest levels within their corporation, including the chief executive officer, chief financial officer, and various other top- ranking chairpersons. They are well-educated, business savvy, and highly driven."},{id:"scifi_creature_from_the_id",name:"Creature From The Id",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:3,scale:"Large",pace:6,parry:7,toughness:10,armor:0,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d10",strength:"d12+8",vigor:"d10"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d10"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d10"}],abilities:[{name:"Bite",effect:"A hit with this attack causes Energy Drain (Smarts)."},{name:"Claws",effect:"The claws of an id monster deal no physical damage, but the target becomes Shaken on a successful hit, or Stunned with a raise."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Invisible",effect:"Id monsters are invisible in their natural state. A character may detect the invisible presence if he has a reason to look and makes a Notice roll at −6. Once detected, he may attack the thing at −6. These creatures radiate heat, so thermal or infravision eliminates their invisibility penalty."},{name:"Invulnerability",effect:"Non-psionic attacks cause no damage, though they can Shake the creature. Multiple Shaken results from non-psionic attacks do not result in a Wound."},{name:"Size 3",effect:"Id creatures stand 10’ tall."},{name:"Weakness (Psionics)",effect:"Id monsters suffer normal damage from psionic attacks."}],description:"Id monsters are created when a psionicist dies from extreme backlash. The entities somehow take physical form and seek out other psionicists—which they slay and feed on (just the brain). If they can be seen, creatures from the id take on a muted and much larger aspect of their creator."},{id:"scifi_cyber_dog",name:"Cyber Dog",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:0,scale:"Normal",pace:10,parry:5,toughness:6,armor:2,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d6",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d10"},{name:"Stealth",die:"d8"}],abilities:[{name:"Armor +2",effect:"Subdermal plates."},{name:"Bite",effect:"Str+d8. Enhanced jaw muscles."},{name:"Enhanced Senses",effect:"+2 to Notice rolls."},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."},{name:"Leg Enhancements",effect:"Pace 10. Cyberenhanced dogs roll a d10 when running instead of a d6."},{name:"Size −1",effect:"The heads of these canines come to an average human’s waist."}],gear:["Installed cyberware: Armor (subdermal plates, +2), infravision, leg enhancements, enhanced vision (cybereyes)"],description:"Cyber-enhanced dogs are typically larger canines such as Rottweilers, Doberman Pinschers, or German Shepherds augmented with cybernetics to improve their use as guard and attack dogs."},{id:"scifi_cyborg_commando",name:"Cyborg Commando",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:8,toughness:17,armor:10,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d12",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d10"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Combat armor (+6), 4× frag grenades, laser rifle (Range 30/60/120, Damage 3d6, RoF 3, AP 2, Cauterize, No Recoil, Overcharge), chain sword (2d6+4)","Installed cyberware: Adrenal surge, 2× Armor (subdermal plates, +4), attribute increase (Strength), skill bonus (targeting eye, Shooting +2)"],description:"Cyborgs, short for cybernetic organism, are part-human and part-machine. This particular example is a modified soldier built for special operations and combat."},{id:"scifi_daniken",name:"Daniken",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:1,scale:"Normal",pace:6,parry:4,toughness:8,armor:0,attributes:{agility:"d8",smarts:"d12",spirit:"d12",strength:"d8",vigor:"d10"},skills:[{name:"Academics",die:"d10"},{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d10"},{name:"Electronics",die:"d10"},{name:"Fighting",die:"d4"},{name:"Healing",die:"d10"},{name:"Notice",die:"d10"},{name:"Persuasion",die:"d10"},{name:"Piloting",die:"d10"},{name:"Psionics",die:"d12"},{name:"Repair",die:"d10"},{name:"Research",die:"d10"},{name:"Science",die:"d12"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d8"},{name:"Survival",die:"d8"}],abilities:[{name:"Fast Regeneration",effect:"May attempt a natural healing roll every round, even if Incapacitated, until slain."},{name:"Size 1",effect:"Danikens are taller than the average human."},{name:"Telepathy",effect:'A daniken can communicate mentally with any sapient lifeform within 12" (24 yards) regardless of language.'},{name:"Unstoppable",effect:"Takes a maximum of one Wound (after Soaking) from any damaging attack unless the attacker’s Action Card is a Joker."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."},{name:"Very Resilient",effect:"Can take two additional Wounds."}],gear:["Items appropriate to their mission","Few carry weapons beyond an EMP baton (Str+d4, EMP) but some daniken civilizations may be more warlike"],description:'Some scholars believe the Earth was visited by beings from distant worlds eons ago. These visitors—collectively called "danikens" in honor of the author of the classic book, Chariots of the Gods?—helped early humans with advancements in technology, architecture, astronomy, and science. In exchange, the young Terran civilizations revered them as gods, even immortalizing their alien benefactors in paintings and sculpture. What happened afterward varies. Perhaps the danikens left Earth, vowing to return when humanity passed a certain developmental milestone. Or maybe they were wiped out by some unforeseen threat, like Earthly viruses, an old enemy that followed them, or just the natural decline of a dying species. In settings where the old myths are true, some danikens might remain, hibernating in long-buried spacecraft under the desert, deep in the jungle, or on the Moon. Or they might be thriving elsewhere in the universe, ready to return upon receiving a special signal. Their return could help humanity leap for the stars—or might trigger a cosmic war against an ancient alien empire. Danikens are peaceful, thin humanoids with uncanny features and a regal demeanor. Their cultural aesthetic strongly resembles that of one (or more) civilizations from antiquity, such as ancient Egyptians, Greeks, Polynesians, Aztecs, Mayans, Mesopotamians, Scythians, Tibetans, Norse, etc. The Setneru (see page 278) are ideal candidates. In some settings, danikens might not be so benevolent, or a renegade individual might turn out to be a more cruel and vengeful god.'},{id:"scifi_darkraptor",name:"Darkraptor",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:6,toughness:6,armor:2,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d8",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +2",effect:"Thick hide."},{name:"Bite/Claws",effect:"Str+d8, AP 2."},{name:"Echolocation",effect:"Darkraptors suffer no penalties for Illumination, even in Pitch Darkness."},{name:"Flight",effect:"Pace 24."},{name:"Size −1",effect:"Raptors weigh just over 100 pounds and are the size of wolves."},{name:"Weakness (Sunlight)",effect:"Darkraptors have no natural protection from ultraviolet light. They take 2d4 damage per round when exposed to sunlight (or extremely powerful UV lights) until they are ash. If the darkraptor is behind Cover, apply the Cover penalty to damage as well."}],description:"Found on worlds with eccentric orbits, long sidereal periods, or which are tidally locked with their stars, darkraptors are carnivores adapted for long periods of darkness. During the day they roost in caverns, ruins, or other dark places. At sunset they emerge in huge ravenous flocks to take advantage of their prey’s limited vision. Darkraptors are slightly smaller than the average human with leathery wings and anvil-shaped heads. Their limbs end in razor- sharp claws."},{id:"scifi_dark_sider",name:"Dark Sider",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:7,toughness:12,armor:6,attributes:{agility:"d8",smarts:"d6",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Battle",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d4"},{name:"Science",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d8"},{name:"Survival",die:"d6"}],abilities:[{name:"Ethereal",effect:"May pass through objects; cannot be harmed by nonmagical attacks; may choose between being invisible (−6 penalty to hit) or visible. Magic items, weapons, and supernatural powers affect them normally."}],gear:["Medium battle armor (+6), 2× frag grenades, disintegrator pistol (Range 3/6/12, Damage 3d10), vibro blade (Str+d6+d4, AP 2)"],description:`There is a mirror universe which overlays our own. Just like our universe, this "Dark Universe" is home to countless species of alien life forms. Chief among them are the dark siders, humanoid spacefarers who have colonized much of their universe already. They want more—they want our universe— but they can't touch us. Yet. They are taking steps to bring the two universes closer. They exploit any phenomenon which opens a gap, or special individuals with the power to perceive the other universe. Since dark siders technically exist in another dimension, albeit one that "echoes" into our own, there is no consistent way to communicate with them. In fact, both parties are unable to properly see their opponents, except as gravitational anomalies such as ripples or lensing. But they deal real damage to one another—even if, to observers, it appears they are battling invisible opponents! The use of specialized gravitational, dimensional, or even magical sensors might be able to bypass this mutual intangibility, or at least mitigate the penalties, but such tools are rare and expensive. The dark siders’ priority is developing such tools for themselves to open the path for their future conquests. Nobody—at least not from this universe— knows what a dark sider looks like. Interacting with one is like encountering a ghost, albeit one that is quite real and highly skilled in combat.`},{id:"scifi_death_worm",name:"Death Worm",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:2,scale:"Large",pace:8,parry:6,toughness:9,armor:2,attributes:{agility:"d6",smarts:"d8 (A)",spirit:"d6",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d8"}],abilities:[{name:"Armor +2",effect:"Hard, scaly skin."},{name:"Bite",effect:"Str+d6."},{name:"Burrow (8)",effect:"Death worms can move through sand and soft soil at full Pace and may attack from below."},{name:"Death Bolt",effect:"Instead of biting, the death worm can fire an internally generated electrical charge strong enough to stop a man’s heart or fry electrical systems in a vehicle. This attack uses Shooting. The worm may do this from just beneath the earth, giving it Near Total Cover (−8). Range 3/6/12, Damage 4d6, AP 10."},{name:"Size 2",effect:"Death worms measure 10’ in length and are 1’ in diameter."}],description:"The death worm is longer than a human is tall, is covered in flexible sand-yellow scales, lives beneath the soft sand of its desert home, and has the ability to kill a grown man at a distance."},{id:"scifi_decapitator",name:"Decapitator",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:2,scale:"Large",pace:6,parry:6,toughness:9,armor:0,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d8",strength:"d12+2",vigor:"d10"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d10"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d10"}],abilities:[{name:"Ambush",effect:"If a decapitator Surprises its prey, it also has The Drop. It makes a Called Shot to the head."},{name:"Brachiation",effect:"Decapitators can move at their full Pace in trees or similar environments and don’t normally need to make Athletics (climbing) rolls."},{name:"Scythes",effect:"Str+d10, AP 4."},{name:"Size 2",effect:"Decapitators weigh over 1000 pounds."}],description:"Decapitators are large simian-like creatures, similar in size to Terran gorillas, but with extended arms ending in sickle-shaped, sharpened bones. They hang from branches by their prehensile feet waiting for prey to pass beneath. When it does, they slash with their scythe-like arms, aiming for the head."},{id:"scifi_deep_diver",name:"Deep Diver",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:6,toughness:8,armor:0,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d8",strength:"d12+4",vigor:"d12"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Aquatic",effect:"Pace 10."},{name:"Barotrauma",effect:'A deep diver that successfully grapples dives on its next turn, descending 10" (20 yards) each round and causing a level of Fatigue that can lead to death for every 10" (20 yards) descended. A character in sealed, pressurized armor ignores the Fatigue, and semi- or aquatic characters only suffer a level of Fatigue for every 50" (100 yards) submerged.'},{name:"Bite",effect:"Str+d6."},{name:"Pressure Resistant",effect:"Deep divers are immune to the effects of rapid pressure change."}],description:"Rather than trying to bite their prey to death, these sturgeon-like fish use their jaws to get a firm grip, then dive (or rise) to a depth where the pressure is deadly to their prey."},{id:"scifi_deep_space_worm",name:"Deep Space Worm",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:12,scale:"Gargantuan",pace:8,parry:5,toughness:26,armor:6,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d10",strength:"d12+12",vigor:"d12"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +6",effect:"Heavy Armor; extremely thick hide."},{name:"Bite",effect:"Str+d10"},{name:"Burrow (16)",effect:"Deep space worms can tunnel easily through solid rock."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Size 12 (Gargantuan)",effect:"The average adult deep space worm is 100 feet long and weighs hundreds of tons."},{name:"Swallow Whole",effect:"Anyone hit by a bite attack must make an Evasion roll or be Swallowed Whole. At the end of the creature’s subsequent turns, anyone swallowed must make a Vigor roll at −2 or take a Wound from the crushing gullet and acidic bile. Shaking, Wounding, or otherwise provoking the creature may result in opportunities to escape with an Athletics roll."},{name:"Unstoppable",effect:"Takes a maximum of one Wound (after Soaking) from any damaging attack unless the attacker’s Action Card is a Joker."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."}],description:"Just like a maggot inside an apple, deep space worms hitch rides on asteroids or comets and bore into them, slowly consuming them from within. Often the only outward clue is a single large cave entrance. But even though their primary diet are minerals, crystals, and raw elements, deep space worms are more than happy to digest the occasional spacecraft or team of unsuspecting astronauts who wander into their labyrinth of tunnels. If the massive worms completely hollow out their habitat, they can survive a short jaunt to other nearby asteroids. Otherwise they can hibernate for eons, waiting for their home to drift somewhere more accommodating. Careful mapping with (expensive!) seismographic equipment can reveal deep space worm tunnels from the surface. The profile below is for an average adult deep space worm, but given a sufficient food source they can grow many times this size. Some planets have terrestrial cousins evolved to fit their new environment."},{id:"scifi_diplomat_politician",name:"Diplomat/Politician",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:2,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Academics",die:"d8"},{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Persuasion",die:"d10"},{name:"Research",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[],gear:["Commlink, personal data device"],description:"In a universe inhabited by numerous alien species, it is the diplomats who stop (and sometimes cause) interplanetary wars and broker trade agreements between cultures. Most diplomats have a small staff of aides who accompany them everywhere they go."},{id:"scifi_dragon",name:"Dragon",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:5,toughness:6,armor:1,attributes:{agility:"d6",smarts:"d6 (A)",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +1",effect:"Scaly hide."},{name:"Bite",effect:"Str+d4."},{name:"Explode",effect:"When a boomer dragon is killed, its organs rupture in a Large Blast Template. Everyone within is automatically hit by the boomer's breath weapon."},{name:"Fiery Breath",effect:"Boomer dragons breathe fire for 3d6 damage. This uses the Cone Template and may be Evaded."}],description:'The name started as a reference to old fairy tales by interstellar travelers and stuck. It applies to all reptiles of human size or larger found throughout the galaxy. Most "dragons" are simply foul-tempered critters that are quick to bite with jagged teeth, but a few have developed spit attacks—from acid to actual fire. These reptiles can spit a jet of fire by mixing volatile chemicals in special glands. Unfortunately, this pressurized gland is also unstable, "booming" when the creature dies.'},{id:"scifi_haze_dragon",name:"Haze Dragon",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:4,toughness:7,armor:1,attributes:{agility:"d4",smarts:"d6 (A)",spirit:"d6",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d4"},{name:"Intimidation",die:"d4"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +1",effect:"Scaly hide."},{name:"Bite",effect:"Str+d4."},{name:"Poison Breath",effect:"Haze dragons can eject a cloud of poisonous gas (any type, usually Mild) in a Cone Template centered directly in front of them. See Poison in Savage Worlds. This may be Evaded."}],description:"Spending their days lounging near geothermal vents, haze dragons can exhale a cloud of poisonous gas to knock out prey."},{id:"scifi_snapdragon",name:"Snapdragon",subtitle:"Apex Predator / Monstrosity",sourcebook:"Sci-Fi Companion",classification:"Monstrosity",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:6,armor:1,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Armor +1",effect:"Scaly hide."},{name:"Bite",effect:"Str+d4."},{name:"Spit Acid",effect:"Snapdragons can spit acid in a Stream Template. Targets splattered with acid suffer 3d6 damage. This may be Evaded. Unless washed off with at least a gallon of water (or a similar basic liquid) the acid deals 3d4 damage for the next two rounds."}],description:"Evolution granted these dragons a sac of concentrated acid—useful for both hunting prey and driving off predators. They also tend to have vestigial wings with bright coloring, fan-like crests, or other vivid markings."},{id:"scifi_draken",name:"Draken",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:5,parry:5,toughness:12,armor:4,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d4"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"}],abilities:[{name:"Gruff",effect:"Subtract 2 from Persuasion rolls."},{name:"Hard Head",effect:"Counts as Horns and deals Str+d4 damage."},{name:"Slow",effect:"Reduce Pace by 1 and running die to d4."},{name:"Toughness +2",effect:"Draken are tough and resilient."}],gear:["Body armor (+4), laser rifle (Range 30/60/120, Damage 3d6, RoF 3, AP 2, Cauterize, No Recoil, Overcharge), molecular knife (Str+d4+2, AP 2), 2× frag grenades"],description:"Draken are a warlike culture of temperamental, turtle-like beings. The following profile is for a typical draken warrior without specialized armor."},{id:"scifi_drendrit",name:"Drendrit",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:4,parry:4,toughness:1,armor:0,attributes:{agility:"d6",smarts:"d4",spirit:"d6",strength:"d4",vigor:"d4"},skills:[{name:"Athletics",die:"d4"},{name:"Common Knowledge",die:"d4"},{name:"Fighting",die:"d4"},{name:"Healing",die:"d4"},{name:"Notice",die:"d4"},{name:"Persuasion",die:"d4"},{name:"Repair",die:"d4"},{name:"Research",die:"d4"},{name:"Science",die:"d4"},{name:"Stealth",die:"d4"},{name:"Survival",die:"d4"}],abilities:[{name:"Braid",effect:'Multiple drendrits can "braid" together, combining their consciousness and abilities. For every drendrit combining to form a colony, modify the base profile with the following: Gain an Edge: The drendrit gains a new Edge. It must meet any prerequisites first. Increase'},{name:"Size −3 (Very Small)",effect:"An individual drendrit is six feet long but only a few inches across, and weighs 15 pounds."}],description:'One of the most unusual species in the known galaxy are the drendrits, pseudo-vegetable polyps from a low-gravity forested world. Drendrit polyps are omnivorous invertebrates with limited intelligence, but multiple drendrits can "braid" together to form a colony. Their combined intellect and shared knowledge make them an accomplished—even brilliant—unit on par with any other sentient galactic beings. Drendrits communicate chemically with one another, but can vibrate (just like vocal cords) to "speak" other languages—though the sound they produce is eerie and not always easy to understand.'},{id:"scifi_drone",name:"Drone",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:1,scale:"Normal",pace:"—",parry:2,toughness:12,armor:4,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"1",vigor:"—"},skills:[{name:"Athletics",die:"d6"},{name:"Electronics",die:"d8"},{name:"Notice",die:"d8"},{name:"Piloting",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d4"}],abilities:[{name:"Armor +4",effect:"Reinforced body."},{name:"Fearless",effect:"The operator is far away, and thus immune to Fear and Intimidation."},{name:"Flight",effect:"Pace 24 (16 MPH). Battle drones may hover in place."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the operator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Size 1",effect:"Battle drones are 8’ long and weigh 400 pounds, though some might be much larger—even the size of vehicles."},{name:"Weakness (Remote Control)",effect:"An EMP or equipment designed to jam the operator’s connection Incapacitates a drone and it crashes."}],gear:["Varies","Usually a Gatling laser (Range 50/100/200, Damage 3d6+4 (I), AP 4, RoF 4, Cauterize, Heavy Weapon, No Recoil, Overcharge) or a missile launcher with eight light missiles (Range 100/200/400, Damage 6d6 (III), AP 16, RoF 4, Heavy Weapon, Guided, SBT)"],description:'Drones are vehicles guided remotely by an operator, and often deployed as guards, scouts, or expendable soldiers. They use the operator’s Piloting skill. The examples below assume an average "jockey," but an elite operator might have much higher skills. For autonomous drones, use the rules for robots (see Chapter Six). These mid-sized drones are capable of carrying heavy ordinance into battle. They can loiter over an area and deliver devastating firepower with deadly precision.'},{id:"scifi_combat_drone",name:"Combat Drone",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:2,toughness:6,armor:2,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d4",vigor:"—"},skills:[{name:"Athletics",die:"d6"},{name:"Electronics",die:"d8"},{name:"Notice",die:"d8"},{name:"Piloting",die:"d6"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"}],abilities:[{name:"Armor +2",effect:"Reinforced body."},{name:"Fearless",effect:"The operator is far away, and thus immune to Fear and Intimidation."},{name:"Flight",effect:"Pace 12 (8 MPH). Combat drones may hover in place."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the operator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Size −1",effect:"Combat drones usually weigh 50 pounds and can fold to a compact size."},{name:"Weakness (Remote Control)",effect:"An EMP or equipment designed to jam the operator’s connection Incapacitates a drone and it crashes."}],gear:["Varies","Usually a laser SMG (Range 15/30/60, Damage 2d6, AP 2, RoF 4, Cauterize, No Recoil, Overcharge)"],description:"Combat drones are small aerial platforms designed to assist soldiers in small skirmishes, deliver small objects, flank enemies, or perform recon in risky areas to avoid endangering flesh-and-blood soldiers. Combat drones geared specifically for scouting have Stealth d8 and a Flight Pace of 16, but no onboard weapons."},{id:"scifi_dwarf_space",name:"Dwarf, Space",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:7,parry:4,toughness:7,armor:1,attributes:{agility:"d6",smarts:"d4",spirit:"d6",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d4"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d4"},{name:"Gambling",die:"d6"},{name:"Intimidation",die:"d6"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d4"},{name:"Piloting",die:"d4"},{name:"Shooting",die:"d4"},{name:"Stealth",die:"d4"}],abilities:[{name:"Increased Strain",effect:"+2 maximum Strain for cyberware."},{name:"Reduced Pace",effect:"Space dwarves’ short legs reduce their Pace by 1 and their running die by one die type."}],gear:["Spacesuit (+1, if in space), matter disintegrator","Installed cyberware: Adrenal surge, leg enhancement, mule, enhanced vision, toxin filters"],description:'"Space dwarves" (a term they strongly dislike) are native to rocky, mountainous worlds where they build extensive cities underground. This makes them well-suited to a life as asteroid miners in remote colonies.'},{id:"scifi_earthquake_beast",name:"Earthquake Beast",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:12,scale:"Gargantuan",pace:6,parry:4,toughness:21,armor:2,attributes:{agility:"d6",smarts:"d4 (A)",spirit:"d8",strength:"d12+12",vigor:"d10"},skills:[{name:"Athletics",die:"d10"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d4"}],abilities:[{name:"Armor +2",effect:"Thick scaly hides."},{name:"Earthquake",effect:'Characters within 12" (24 yards) of a moving earthquake beast must make an Agility roll each round (a free action) or fall prone. A Critical Failure means the character is Stunned as well!'},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Resilient",effect:"Can take one additional Wound."},{name:"Size 12 (Gargantuan)",effect:"Earthquake beasts weigh as much as 500 tons."},{name:"Slow Nervous System",effect:"The earthquake beast’s slow nervous system means it barely registers pain and shock. It adds +2 to recover from being Shaken and ignores all Wound penalties."},{name:"Stomp",effect:"Str+d10."},{name:"Swat",effect:"Ignores up to 4 points of Scale penalties when attacking creatures smaller than itself."},{name:"Tail Lash",effect:"Str+d4. The creature may make a free attack against up to two foes to its side or rear at no penalty."}],description:"Earthquake beasts are enormous, long- necked herbivores, similar to the diplodocus, but with six legs and a tail almost half the length of their body. They weigh so much that when they walk, the ground literally shakes. They are notoriously stupid and shortsighted. Once they make their minds up to go somewhere, they walk through everything in their path—including buildings, vehicles, and creatures too slow to clear their stride."},{id:"scifi_elf_space",name:"Elf, Space",subtitle:"Humanoid / NPC",sourcebook:"Sci-Fi Companion",classification:"Humanoid & Folk",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:9,armor:4,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d6"},{name:"Healing",die:"d8"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d6"},{name:"Shooting",die:"d8"},{name:"Spellcasting",die:"d6"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"}],abilities:[{name:"Low Light Vision",effect:"Elves ignore penalties for Dim and Dark lighting."}],gear:["Light battle armor (+4), force sword (Str+2d6, AP 2), pulse pistol (Range 10/20/40, Damage 2d6, Overcharge), medi-gel"],description:'Much like their counterparts from fantasy settings, space elves are slender, graceful beings with pointed ears and—if it exists in the setting—an innate connection to magic. They often live on worlds with elegant cities that co-exist in harmony with the natural environment. If they have achieved starfaring ability, they craft magnificent, aesthetically pleasing craft that appear fragile to outsiders— until they effortlessly shrug off attacks! "Dark" elves in the far reaches of space are deadly efficient. They might be ruthless reavers preying on the space lanes or form draconian empires that seek to dominate "lesser" civilizations. The following profile is for a typical space elf warrior with magical abilities.'},{id:"scifi_eliminator",name:"Eliminator",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:16,armor:6,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d12+2",vigor:"d12+2"},skills:[{name:"Academics",die:"d8"},{name:"Athletics",die:"d8"},{name:"Battle",die:"d6"},{name:"Boating",die:"d6"},{name:"Common Knowledge",die:"d10"},{name:"Driving",die:"d8"},{name:"Electronics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Hacking",die:"d10"},{name:"Intimidation",die:"d10"},{name:"Language (All)",die:"d8"},{name:"Notice",die:"d10"},{name:"Persuasion",die:"d10"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"},{name:"Thievery",die:"d8"}],abilities:[{name:"Armor +6",effect:"Sturdy, reinforced body."},{name:"Construct",effect:"+2 to recover from being Shaken; ignores 1 point of Wound penalties; doesn’t breathe or suffer from disease or poison."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Resilient",effect:"Can take one additional Wound."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the eliminator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Targeting",effect:"Negates 2 points of Range or Unstable Platform penalties."},{name:"Unstoppable",effect:"Takes a maximum of one Wound (after Soaking) from any damaging attack unless the attacker’s Action Card is a Joker."}],description:'Eliminators are robots designed for one purpose: to eliminate a target. Until they achieve this goal, nothing short of complete destruction can stop one. Equipped with advanced sensors, an exhaustive database, vocal synthesizers, artificial intelligence, and a state-of-the-art CPU, eliminators can overcome nearly any obstacle between themselves and their targets. Eliminators are often used as foot soldiers, a task for which they are ruthlessly efficient, but are sometimes sent on solitary missions against high-value targets. These are almost always Wild Cards. These eliminators generally appear as metallic skeletons, though some are covered with a synthetic skin which allows them to avoid scrutiny while "hunting."'},{id:"scifi_eliminator_mk_ii",name:"Eliminator Mk Ii",subtitle:"Autonomous Machine / Construct",sourcebook:"Sci-Fi Companion",classification:"Construct",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:6,toughness:12,armor:2,attributes:{agility:"d8",smarts:"d8",spirit:"d8",strength:"d12+2",vigor:"d12+2"},skills:[{name:"Academics",die:"d8"},{name:"Athletics",die:"d8"},{name:"Battle",die:"d6"},{name:"Boating",die:"d6"},{name:"Common Knowledge",die:"d10"},{name:"Driving",die:"d8"},{name:"Electronics",die:"d10"},{name:"Fighting",die:"d8"},{name:"Hacking",die:"d10"},{name:"Intimidation",die:"d10"},{name:"Language (All)",die:"d8"},{name:"Notice",die:"d10"},{name:"Persuasion",die:"d10"},{name:"Piloting",die:"d8"},{name:"Repair",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d8"},{name:"Stealth",die:"d10"},{name:"Survival",die:"d8"},{name:"Thievery",die:"d8"}],abilities:[{name:"Armor +2",effect:"Sturdy, reinforced body."},{name:"Construct",effect:"+2 to recover from being Shaken; ignores 1 point of Wound penalties; doesn’t breathe or suffer from disease or poison."},{name:"Fast Regeneration",effect:"Mk II eliminators may attempt a natural healing roll every round, even if Incapacitated, unless their Wounds were caused by extreme sources of heat or cold."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Hardy",effect:"A second Shaken result in combat doesn’t cause a Wound."},{name:"Liquid Construction",effect:"Immune to Called Shots; may change shape (but not Size) as a limited free action."},{name:"Resilient",effect:"Can take one additional Wound."},{name:"Sensors",effect:"Optical, chemical, motion, and other sensors ignore Illumination penalties. If it scans as an action, the eliminator adds a +2 bonus to Electronics or Notice rolls to detect targets within 500 yards."},{name:"Targeting",effect:"Negates 2 points of Range or Unstable Platform penalties."},{name:"Unstoppable",effect:"Eliminators take a maximum of one Wound per attack no matter how many Wounds would normally be caused (after Soak rolls are made)."}],description:"Taking advantage of further advancements in technology, these eliminators are made of a high-tech metal alloy which can act as both a fluid or a solid at the expense of durability."},{id:"scifi_emotor",name:"Emotor",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:5,toughness:3,armor:0,attributes:{agility:"d8",smarts:"d4",spirit:"d6",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d6"},{name:"Notice",die:"d6"},{name:"Psionics",die:"d10"},{name:"Stealth",die:"d8"}],abilities:[{name:"Crystallize Emotions",effect:"Each emotor has 1d4 crystallized emotions protruding from its body. Removing them requires complex surgery (which most hunters don’t bother with) or killing the creature (which is much easier). Emotion crystals are consumed for the powerful effect of the emotion and have a Duration of 10 minutes. Some examples are included below, but the GM is encouraged to devise her own list of extra emotions. Anger: The user immediately goes Berserk (per the Edge) and cannot attempt to calm himself until the crystal has run its course. Calm: The user draws an extra initiative card. This stacks with Level Headed. However, he also suffers −2 to Persuasion rolls. Compassion: The user gains the Heroic Hindrance and the same benefit granted by a successful casting of the empathy power (normal casting only, with no raise or Power Modifiers). Courage: The consumer gains +2 to Fear checks, but also gains the Overconfident Hindrance. Fear: The user makes Fear checks at −2 and any rolls on the Fear Table are made at +2. The spike of adrenaline also grants him the Nerves of Steel Edge (or Improved Nerves of Steel if he already has it). Hatred: The user gains the Bloodthirsty Hindrance, but also gains +2 to resist Spirit-based Tests. Love: The user gains the Charismatic Edge and the Pacifist (Major) Hindrance."},{name:"Size −2 (Small)",effect:"Emotors are the size of lemurs."}],description:"Emotors are semi-sentient, psionic creatures resembling furless lemurs. They have the unusual ability to crystallize their emotion into solid form. How and why they do this is a mystery, but they are hunted for their “emotion crystals,” which fetch high prices on the black market."},{id:"scifi_energy_elemental",name:"Energy Elemental",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:5,toughness:7,armor:0,attributes:{agility:"d8",smarts:"d8",spirit:"d10",strength:"d8",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d10"}],abilities:[{name:"Atomic Attack",effect:'Atomic elementals can fire a wave of energy using a Cone Template, or fire balls of energy using any other size template, up to 50" distant (100 yards) at no Range penalty. This uses their Shooting skill and causes 5d10 damage against a target’s weakest Armor. Any creature Shaken or Wounded by the attack must make a Vigor roll or suffer radiation sickness (see Savage Worlds).'},{name:"Atomic Aura",effect:"At the end of its movement, and at the creature’s will, all adjacent creatures suffer 3d10 damage from the elemental’s intense heat and radiation. Any creature Shaken or Wounded by the attack must make a Vigor roll or suffer radiation poisoning (see Savage Worlds)."},{name:"Bash",effect:"Str+2d10."},{name:"Elemental",effect:'No additional damage from Called Shots; ignore 1 point of Wound penalties; doesn’t breathe; immune to disease and poison; ignore penalties for Illumination up to 10" (20 yards).'},{name:"Ethereal",effect:"Atomic elementals are made of pure energy."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Flight",effect:"Pace FTL. Atomic elementals may fly in any environment at the same speed as the setting’s standard FTL drives."},{name:"Invulnerability",effect:"Atomic elementals are invulnerable to all normal types of damage. They are susceptible to arcane attack forms (such as psionics)."},{name:"Leech",effect:"Atomic elementals can only exist outside of their extreme conditions for a number of days equal to their Vigor, but can feed off nuclear reactions and radioactive material. Each day’s worth of fusion-based starship energy, or week’s worth of vehicular energy, takes the being a minute to consume and gives it another day of life outside its native environment."},{name:"Weakness (Energy Drain)",effect:"Atomic elementals have no true Weakness other than their need for vast amounts of energy. This sets them up for scientific contraptions that isolate, drain, or overload their energy and disperse them. This might be accomplished by a scientist with access to theoretical materials and a Dramatic Task."}],description:"Energy elementals are swirling clouds or balls of intense energy, though they often take the shape of any beings with which they care to entreat. Elementals don’t speak, but can communicate by forming shapes, symbols, or simple images of pure energy. Travelers have said dealing with them is almost like talking to a hyperintelligent toddler in a foreign language. Energy elementals do not have a set size, as such physical limitations are meaningless to them. The same elemental may appear as a diminutive spark of elemental essence or a vast raging cloud the size of a planet— whichever magnitude seems appropriate for the task at hand. Changing size takes a great deal of time and effort so they are usually stuck with their chosen measurements for the duration of an encounter. All energy elementals are extremely powerful creatures that should not be introduced into an encounter without some thought. They aren't good or evil; they embody the power and danger of a type of energy, and lash out at those who try to contain or disturb them. Atomic elementals consist of crackling bluish-white nuclear energy living in or near stars or areas of extreme radiation. They cannot survive long outside their native environments where fuel is plentiful. When they travel, they are known to leech energy from fusion-powered starships, vehicles, or power plants they find along their way. Atomic elementals are spheres in their natural state, but can take on humanoid states when they wish to communicate."},{id:"scifi_light_elemental",name:"Light Elemental",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:16,parry:5,toughness:4,armor:0,attributes:{agility:"d12",smarts:"d8",spirit:"d10",strength:"d4",vigor:"d4"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d12"}],abilities:[{name:"Blinding",effect:'At the end of its movement, and at the creature’s will, all creatures within 5" (10 yards) must roll Vigor or become blind (−6 to all physical actions) for 1d4 rounds and Stunned. A Critical Failure means the victim is permanently blind! Creatures without the ability to see light are immune to this effect.'},{name:"Elemental",effect:'No additional damage from Called Shots; ignore 1 point of Wound penalties; doesn’t breathe; immune to disease and poison; ignore penalties for Illumination up to 10" (20 yards).'},{name:"Energy Attack",effect:"Light elementals can fire a powerful beam of concentrated light using their Shooting skill (Range 50/100/200, Damage 3d10+3, AP 4)."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Flight",effect:"Light elementals fly at the speed of light (−10 to attack them). When taking mortal form, they have a d12 running die."},{name:"Invulnerability",effect:"Light elementals are invulnerable to all normal types of damage. They are susceptible to arcane attack forms (such as psionics)."},{name:"Semi-Ethereal",effect:"May pass through transparent objects; cannot be harmed by nonmagical attacks; may choose between being invisible (−6 penalty to hit) or visible. Magic items, weapons, and supernatural powers affect them normally."},{name:"Weakness (Refraction)",effect:"Light elementals are vulnerable to anything that refracts their light. Physical weapons have no effect, but high-power magnets, prisms, black holes, and similar disruptive objects deal 3d6 damage."}],description:"Composed of standing waves of electromagnetic energy, light elementals skip merrily over the void, playing amongst the brilliance of stars and communicating with one another over great spans of space and time."},{id:"scifi_plasma_elemental",name:"Plasma Elemental",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:8,parry:5,toughness:6,armor:0,attributes:{agility:"d10",smarts:"d8",spirit:"d8",strength:"d8",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d6"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Science",die:"d8"},{name:"Shooting",die:"d10"}],abilities:[{name:"Bash",effect:"Str+2d10."},{name:"Burn",effect:"Anyone hit by an elemental’s bash or fiery aura must make an Evasion roll or catch fire, taking 2d6 damage."},{name:"Elemental",effect:'No additional damage from Called Shots; ignore 1 point of Wound penalties; doesn’t breathe; immune to disease and poison; ignore penalties for Illumination up to 10" (20 yards).'},{name:"Energy Attack",effect:'Plasma elementals can attack with a Cone Template, or fire balls of energy using any other size template, up to 25" distant (50 yards). This uses their Shooting skill and causes 3d10 damage against a target’s weakest Armor. Victims Shaken or Wounded by such an attack may catch fire (see Savage Worlds).'},{name:"Ethereal",effect:"May pass through objects; cannot be harmed by nonmagical attacks; may choose between being invisible (−6 penalty to hit) or visible. Magic items, weapons, and supernatural powers affect them normally."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Fiery Aura",effect:"At the end of its movement all adjacent creatures suffer 2d10 damage from the elemental’s intense heat."},{name:"Flight",effect:"Plasma elementals fly at speeds up to 600 MPH."},{name:"Invulnerability",effect:"Plasma elementals are invulnerable to heat- and fire-based attacks."},{name:"Weakness (Dissipation)",effect:"Plasma elementals are somewhat vulnerable to anything that disrupts their charged state. Kinetic and fire-based weapons have no effect, but high-voltage electricity, EMPs, magnetism, and most other energy forms cause half-damage."}],description:"Plasma elementals are composed entirely of swirling, burning, superheated gas. They are typically found only in the outer layers of suns or the cores of large planets."},{id:"scifi_time_elemental",name:"Time Elemental",subtitle:"Cosmic / Aberration",sourcebook:"Sci-Fi Companion",classification:"Aberration",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:6,toughness:7,armor:0,attributes:{agility:"d8",smarts:"d10",spirit:"d12",strength:"d8",vigor:"d10"},skills:[{name:"Athletics",die:"d6"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d10"},{name:"Science",die:"d12+2"}],abilities:[{name:"Elemental",effect:'No additional damage from Called Shots; ignore 1 point of Wound penalties; doesn’t breathe; immune to disease and poison; ignore penalties for Illumination up to 10" (20 yards).'},{name:"Ethereal",effect:"May pass through objects; cannot be harmed by nonmagical attacks; may choose between being invisible (−6 penalty to hit) or visible. Magic items, weapons, and supernatural powers affect them normally."},{name:"Fearless",effect:"Immune to Fear and Intimidation."},{name:"Flicker",effect:"Time elementals flicker rapidly in and out of time at random intervals. All attacks against them, even those of arcane nature, are made at −4."},{name:"Teleport",effect:"Time elementals can teleport to any time or place as a limited action. They cannot extend this ability to others, nor can they carry items with them as they travel."},{name:"Time Control",effect:"At the beginning of any round of combat, after Action Cards have been dealt and locked in but before anyone acts, a time elemental can make a Spirit roll to swap two Action Cards with a success or four with a raise (except Jokers)."},{name:"Time Stop",effect:"Once per encounter, a time elemental may momentarily pause time for all but itself. This grants the time elemental 1d4+1 new turns, which it must take immediately. During these turns it may act as normal on its current Action Card. This effect ends if any of the time elemental’s actions affect another character or creature."},{name:"Wither",effect:"Time elementals may make a Touch Attack which causes Energy Drain (Vigor). If Vigor falls below d4 the victim permanently gains the Elderly Hindrance, or perishes if he is already Elderly."}],description:"Time elementals are beings made from the raw essence of spacetime itself. They resemble bottomless wells of total darkness—like black holes. Most are more interested in studying the point in time in which they have appeared than warring on the inhabitants. They might be guardians of the time stream, or simply manifest around anomalies such as black holes and rage against any intruder they find there."},{id:"scifi_energy_leech",name:"Energy Leech",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:"—",parry:2,toughness:5,armor:0,attributes:{agility:"d8",smarts:"d4 (A)",spirit:"d10",strength:"d8",vigor:"d6"},skills:[{name:"Athletics",die:"d4"},{name:"Notice",die:"d6"},{name:"Shooting",die:"d10"},{name:"Stealth",die:"d6"}],abilities:[{name:"Electrical Attack",effect:"Energy leeches channel their own bioelectric energy into a deadly bolt using Shooting (Range 4/8/16, Damage 3d6)."},{name:"Energy Drain",effect:"When attached to a power source, the creature drains a day’s worth of energy or fuel every five minutes (and five creatures drain a day’s worth of energy every minute!)."},{name:"Flight",effect:"Pace 2. When energy leeches sense powerful electricity, they draw forth an arc and “ride” it to the device at incredibly high speeds (10,000 MPH in the upper stratosphere or space). Herds of the things often travel in on a single arc, slowing just before impact to attach themselves to the target’s hull or walls."},{name:"Immunity",effect:"Energy leeches are immune to electricity and electrical attacks."},{name:"Vacuum Born",effect:"The creature is naturally adapted for life in space. It does not breathe, ignores the effects of a vacuum, and is immune to cold damage."}],description:"Energy leeches have a central, bulbous sac surrounded by a myriad of long tentacles. The sac is filled with hydrogen, which allows the energy leech to float on wind currents in the upper atmosphere. They have no mouth, but instead feed on electrical energy. Energy leeches float in packs of 3d6 individual creatures. They catch and prey on the bioelectrical signals of small creatures, but are also able to handle the vastly greater high-energy emissions of a starship’s engines or other machines. Once attached to such a device (such as a ship’s hull), they begin to leech energy at an alarming rate."},{id:"scifi_explorer",name:"Explorer",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:7,armor:1,attributes:{agility:"d6",smarts:"d8",spirit:"d8",strength:"d6",vigor:"d8"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Driving",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Piloting",die:"d6"},{name:"Repair",die:"d6"},{name:"Science",die:"d8"},{name:"Shooting",die:"d6"},{name:"Stealth",die:"d6"},{name:"Survival",die:"d8"}],abilities:[],gear:["Smart sleeve (+1), commlink, laser pistol (Range 15/30/60, Damage 2d6, AP 2, Cauterize, Overcharge), machete (Str+d6), personal data device, survival gear"],description:"Explorers are brave souls who investigate new worlds, parallel universes, or ancient ruins of long-dead alien civilizations, and often are the ones to make first contact with new sentient life forms."},{id:"scifi_fisher",name:"Fisher",subtitle:"Alien Fauna / Beast",sourcebook:"Sci-Fi Companion",classification:"Beast",isWildCard:!1,size:4,scale:"Large",pace:4,parry:6,toughness:12,armor:2,attributes:{agility:"d8",smarts:"d6 (A)",spirit:"d10",strength:"d12+3",vigor:"d8"},skills:[{name:"Athletics",die:"d8"},{name:"Fighting",die:"d8"},{name:"Intimidation",die:"d8"},{name:"Notice",die:"d8"},{name:"Stealth",die:"d8"}],abilities:[{name:"Armor +2",effect:"Fishers have thin carapaces."},{name:"Bite",effect:"Str+d8."},{name:"Flight",effect:"Pace 12."},{name:"Infravision",effect:"Halve Illumination penalties when attacking warm targets."},{name:"Size 4 (Large)",effect:"Fishers are 20’ across."},{name:"Tentacles (4)",effect:"Four tentacle actions and Reach 4. Tentacles deal Str+d4 damage. Bound or Entangled prey may be bitten as usual."}],description:"Fishers are large flying creatures with four long tentacles instead of legs. They hover silently over woodland areas, using their infravision to detect the body heat of prey. Their name comes from their peculiar style of hunting. Rather than simply use their tentacles to grab prey, they dedicate one tentacle to holding a lure, be this a clump of plants or a small animal, and use it to entice prey much as a fisherman does with bait. Once satisfied the target is “hooked,” they use their other tentacles to grab it."},{id:"scifi_floran",name:"Floran",subtitle:"Sci-Fi Adversary",sourcebook:"Sci-Fi Companion",classification:"Alien",isWildCard:!1,size:0,scale:"Normal",pace:6,parry:4,toughness:5,armor:0,attributes:{agility:"d6",smarts:"d6",spirit:"d6",strength:"d6",vigor:"d6"},skills:[{name:"Athletics",die:"d6"},{name:"Common Knowledge",die:"d6"},{name:"Fighting",die:"d4"},{name:"Notice",die:"d6"},{name:"Persuasion",die:"d6"},{name:"Stealth",die:"d4"}],abilities:[{name:"Bloodless",effect:"Florans automatically stabilize whenever they would Bleed Out without rolls or ill effects."},{name:"Dependency (Sunlight)",effect:"Florans must bask in sunlight (artificial or otherwise) once per day or suffer Fatigue. This can lead to death. Fatigue is recovered at the rate of one level per hour of sunshine."},{name:"Environmental Weakness (Heat/Fire)",effect:"Florans subtract 4 from Fatigue checks made to resist the effects of
