    <title>SWADE Character Forge — Savage Worlds Adventure Edition</title>
    <script>
      // If served statically from repository root on GitHub Pages (where /src/main.tsx is uncompiled),
      // redirect immediately to the compiled production build in ./dist/
      if (
        window.location.hostname.endsWith('github.io') &&
        !window.location.pathname.includes('/dist') &&
        !window.location.pathname.includes('/docs')
      ) {
        var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
        window.location.replace(window.location.origin + base + 'dist/' + window.location.search + window.location.hash);
      }
    </script>
    <script type="module" crossorigin src="./assets/index-BuXgjqKS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D2xO7Sdp.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Purge any stale service worker caches from previous versions
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var key of keys) {
            caches.delete(key);
          }
        });
      }
    </script>
  </body>
